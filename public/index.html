<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Sync — Plaid</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 860px; margin: 40px auto; padding: 0 20px;
    background: #fafafa; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    .card { background: #1b1b1b !important; border-color: #2c2c2c !important; }
    th { color: #999 !important; border-color: #2c2c2c !important; }
    td { border-color: #232323 !important; }
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #777; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: #fff; border: 1px solid #e5e5e5; border-radius: 12px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; font-size: 14px; padding: 9px 16px;
    border-radius: 8px; border: none; cursor: pointer;
    background: #16a34a; color: #fff;
  }
  button.secondary { background: #eee; color: #222; }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: 13px; color: #777; margin-left: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e5e5e5; color: #888; font-weight: 600; }
  td { padding: 7px 6px; border-bottom: 1px solid #f0f0f0; }
  td.amt { text-align: right; font-variant-numeric: tabular-nums; }
  .neg { color: #c0392b; }
  .pos { color: #1e8449; }
  .institutions { font-size: 13px; color: #555; margin-top: 8px; }
  .empty { color: #999; font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>

<h1>Bank Sync</h1>
<div class="sub">Connects live via Plaid, then exports a CSV formatted for Ledger Vault Cloud's importer.</div>

<div class="card">
  <div class="row">
    <button id="connectBtn">Connect a bank or card</button>
    <button id="syncBtn" class="secondary">Sync now</button>
    <button id="exportBtn" class="secondary">Export CSV</button>
    <span id="status"></span>
  </div>
  <div id="institutions" class="institutions"></div>
</div>

<div class="card">
  <div id="txTableWrap"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const statusEl = $('#status');

function setStatus(msg) { statusEl.textContent = msg || ''; }

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error ? JSON.stringify(body.error) : `${res.status} ${res.statusText}`);
  }
  return res.json();
}

async function loadInstitutions() {
  const items = await api('/api/items');
  const el = $('#institutions');
  el.textContent = items.length
    ? 'Connected: ' + items.map((i) => i.institution_name).join(', ')
    : 'No banks connected yet.';
}

function fmtAmt(n) {
  const v = Number(n);
  const s = v.toFixed(2);
  return v < 0 ? `<span class="neg">-$${Math.abs(v).toFixed(2)}</span>` : `<span class="pos">$${s}</span>`;
}

async function loadTransactions() {
  const tx = await api('/api/transactions');
  const wrap = $('#txTableWrap');
  if (!tx.length) {
    wrap.innerHTML = '<div class="empty">No transactions yet. Connect a bank, then hit Sync.</div>';
    return;
  }
  const rows = tx.slice(0, 200).map((t) => `
    <tr>
      <td>${t.date}</td>
      <td>${(t.merchant_name || t.name || '').replace(/</g, '&lt;')}</td>
      <td class="amt">${fmtAmt(-t.amount)}</td>
    </tr>`).join('');
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function refreshAll() {
  await Promise.all([loadInstitutions(), loadTransactions()]);
}

$('#connectBtn').addEventListener('click', async () => {
  setStatus('Opening Plaid Link…');
  try {
    const { link_token } = await api('/api/create_link_token', { method: 'POST' });
    const handler = Plaid.create({
      token: link_token,
      onSuccess: async (public_token, metadata) => {
        setStatus('Linking account…');
        await api('/api/exchange_public_token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            public_token,
            institution_name: metadata?.institution?.name,
          }),
        });
        setStatus('Connected.');
        await refreshAll();
      },
      onExit: (err) => { if (err) console.error(err); setStatus(''); },
    });
    handler.open();
  } catch (e) {
    console.error(e);
    setStatus('Error opening Link — check the server console.');
  }
});

$('#syncBtn').addEventListener('click', async () => {
  setStatus('Syncing…');
  try {
    await api('/api/sync', { method: 'POST' });
    setStatus('Synced.');
    await refreshAll();
  } catch (e) {
    console.error(e);
    setStatus('Sync failed — check the server console.');
  }
});

$('#exportBtn').addEventListener('click', () => {
  window.location.href = '/api/export.csv';
});

refreshAll();
</script>
</body>
</html>

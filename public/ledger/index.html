/* =========================================================
   Charts: hand-rolled SVG, measured to container width.
   Hover tooltips come from [data-tip] via one global handler.
   ========================================================= */
const chartJobs = new Map();
let chartSeq = 0;
function chartSlot(fn, height = 220) {
  const id = 'ch' + (++chartSeq);
  chartJobs.set(id, fn);
  return `<div class="chart" data-chart="${id}" style="height:${height}px"></div>`;
}
function mountCharts() {
  for (const el of $$('[data-chart]')) {
    const fn = chartJobs.get(el.dataset.chart);
    if (fn) { try { el.innerHTML = fn(el.clientWidth || 600, el.clientHeight || 220); } catch (e) { console.error(e); el.innerHTML = ''; } }
  }
}
window.addEventListener('resize', debounce(() => { if (S) mountCharts(); }, 120));

const tipRow = (label, value, color) => `<div class="tr"><span>${color ? `<i class="dot" style="--dot:${color}"></i>` : ''}${esc(label)}</span><b>${esc(value)}</b></div>`;
const tipAttr = (title, rows) => ` data-tip="${esc(`<div class="tt">${esc(title)}</div>${rows.join('')}`)}"`;

function niceScale(maxV, minV = 0, ticks = 4) {
  const span = maxV - minV;
  if (span <= 0) return { lo: minV, hi: minV + 1, step: 1 };
  const raw = span / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { lo: Math.floor(minV / step) * step, hi: Math.ceil(maxV / step) * step, step };
}
const topRounded = (x, y, w, h, r) => {
  r = Math.min(r, h, w / 2);
  if (h <= 0) return '';
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
};
const axisMoney = (c) => money(c, { compact: true });

/* Grouped columns: labels[], series[{name,color,values[]}] */
function columnsChart({ labels, series, fmt = (v) => money(v, { whole: true }), tipTitle = (i) => labels[i], extraTip = () => [] }) {
  return (W, H) => {
    const padL = 54, padR = 6, padT = 10, padB = 26;
    const pw = Math.max(40, W - padL - padR), ph = H - padT - padB;
    const maxV = Math.max(1, ...series.flatMap((s) => s.values));
    const { hi, step } = niceScale(maxV);
    const n = labels.length, k = series.length;
    const band = pw / n;
    const barW = Math.max(4, Math.min(24, (band * 0.72 - (k - 1) * 2) / k));
    const groupW = k * barW + (k - 1) * 2;
    const y = (v) => padT + ph - (v / hi) * ph;
    let g = '';
    for (let v = 0; v <= hi + 1e-9; v += step) {
      const yy = Math.round(y(v)) + 0.5;
      g += `<line class="${v === 0 ? 'baseline' : 'gridline'}" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/>`;
      g += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" class="amt">${esc(axisMoney(v))}</text>`;
    }
    const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 46))));
    let bars = '', hits = '';
    for (let i = 0; i < n; i++) {
      const x0 = padL + i * band + (band - groupW) / 2;
      series.forEach((s, j) => {
        const v = s.values[i] || 0;
        const h = (v / hi) * ph;
        if (h > 0) bars += `<path d="${topRounded(x0 + j * (barW + 2), y(v), barW, h, 4)}" style="fill:${s.color}"/>`;
      });
      if (i % every === 0 || i === n - 1) bars += `<text x="${padL + i * band + band / 2}" y="${H - 6}" text-anchor="middle">${esc(labels[i])}</text>`;
      const rows = series.map((s) => tipRow(s.name, fmt(s.values[i] || 0), s.color)).concat(extraTip(i));
      hits += `<g class="hit"${tipAttr(tipTitle(i), rows)}><rect class="hitbox" x="${padL + i * band}" y="${padT}" width="${band}" height="${ph}" rx="6"/></g>`;
    }
    return `<svg width="${W}" height="${H}" role="img">${g}${hits}<g pointer-events="none">${bars}</g></svg>`;
  };
}

/* Line chart: labels[], series[{name,color,values[] (null = gap), area?, dim?}] */
function lineChart({ labels, series, zero = true, fmt = (v) => money(v, { whole: true }), tipTitle = (i) => labels[i], labelEvery }) {
  return (W, H) => {
    const padL = 58, padR = 10, padT = 12, padB = 26;
    const pw = Math.max(40, W - padL - padR), ph = H - padT - padB;
    const all = series.flatMap((s) => s.values.filter((v) => v != null));
    if (!all.length) return '';
    let maxV = Math.max(...all), minV = Math.min(...all);
    if (zero) minV = Math.min(0, minV);
    else { const padV = (maxV - minV) * 0.15 || Math.abs(maxV) * 0.05 || 100; minV -= padV; maxV += padV; }
    const { lo, hi, step } = niceScale(maxV, minV);
    const n = labels.length;
    const x = (i) => padL + (n <= 1 ? pw / 2 : (i / (n - 1)) * pw);
    const y = (v) => padT + ph - ((v - lo) / (hi - lo)) * ph;
    let g = '';
    for (let v = lo; v <= hi + 1e-9; v += step) {
      const yy = Math.round(y(v)) + 0.5;
      g += `<line class="${v === lo ? 'baseline' : 'gridline'}" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/>`;
      g += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" class="amt">${esc(axisMoney(v))}</text>`;
    }
    const every = labelEvery || Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 56))));
    for (let i = 0; i < n; i++) if (i % every === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 && n > 1 ? 'start' : i === n - 1 && n > 1 ? 'end' : 'middle'}">${esc(labels[i])}</text>`;
    let paths = '', dots = '';
    for (const s of series) {
      let d = '', started = false, firstX = null, lastX = null, lastI = -1;
      s.values.forEach((v, i) => {
        if (v == null) return;
        d += `${started ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
        if (!started) firstX = x(i);
        started = true; lastX = x(i); lastI = i;
      });
      if (!started) continue;
      if (s.area) paths += `<path d="${d}L${lastX.toFixed(1)},${y(Math.max(lo, 0)).toFixed(1)}L${firstX.toFixed(1)},${y(Math.max(lo, 0)).toFixed(1)}Z" style="fill:${s.color}" opacity=".1"/>`;
      paths += `<path d="${d}" style="fill:none;stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dim ? 'opacity=".75"' : ''}/>`;
      dots += `<circle cx="${lastX}" cy="${y(s.values[lastI])}" r="4.5" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`;
    }
    let hits = '';
    const slot = n <= 1 ? pw : pw / (n - 1);
    for (let i = 0; i < n; i++) {
      const rows = series.filter((s) => s.values[i] != null).map((s) => tipRow(s.name, fmt(s.values[i]), s.color));
      if (!rows.length) continue;
      const hx = Math.max(padL, x(i) - slot / 2);
      const hw = Math.min(W - padR, x(i) + slot / 2) - hx;
      hits += `<g class="hit"${tipAttr(tipTitle(i), rows)}><rect class="hitbox" x="${hx}" y="${padT}" width="${Math.max(hw, 1)}" height="${ph}" style="fill:transparent"/><line class="guide" x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${padT + ph}"/></g>`;
    }
    return `<svg width="${W}" height="${H}" role="img">${g}<g pointer-events="none">${paths}</g>${hits}<g pointer-events="none">${dots}</g></svg>`;
  };
}

/* Small sparkline, fixed box */
function sparkline(values, color = 'var(--c0)', w = 140, h = 36) {
  const v = values.filter((x) => x != null);
  if (v.length < 2) return '';
  const max = Math.max(...v), min = Math.min(...v), span = max - min || 1;
  const pts = v.map((val, i) => `${((i / (v.length - 1)) * (w - 8) + 4).toFixed(1)},${(h - 5 - ((val - min) / span) * (h - 10)).toFixed(1)}`);
  const last = pts[pts.length - 1].split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.join(' ')}" style="fill:none;stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" style="fill:${color};stroke:var(--surface)" stroke-width="2"/></svg>`;
}

/* HTML horizontal bars: items [{label, value, color?, marker?, tip?, right?, cls?}] */
function hbars(items, { max, fmt = (v) => money(v, { whole: true }), barColor = 'var(--c0)' } = {}) {
  if (!items.length) return '<p class="muted small">Nothing to show yet.</p>';
  const m = max || Math.max(1, ...items.map((i) => Math.max(i.value, i.marker || 0)));
  return `<div class="hbars">${items.map((it) => {
    const w = clamp((it.value / m) * 100, 0, 100);
    const mk = it.marker ? `<div class="hbar-marker" style="left:${clamp((it.marker / m) * 100, 0, 100)}%"></div>` : '';
    const tip = it.tip ? tipAttr(it.label, it.tip) : '';
    return `<div class="hbar"${tip}><div class="hbar-label">${it.color != null ? `<i class="dot" style="--dot:${it.color}"></i>` : ''}<span class="t">${esc(it.label)}</span></div><div class="hbar-track"><div class="hbar-fill ${it.cls || ''}" style="width:${w}%;--bar:${it.bar || barColor}"></div>${mk}</div><div class="hbar-value amt">${it.right != null ? it.right : esc(fmt(it.value))}</div></div>`;
  }).join('')}</div>`;
}

const legend = (items) => `<div class="legend">${items.map(([name, color, line]) => `<span><i class="${line ? 'line' : ''}" style="--dot:${color}"></i>${esc(name)}</span>`).join('')}</div>`;

/* Global tooltip */
(function initTooltip() {
  let cur = null;
  const tip = () => document.getElementById('tip');
  const place = (e) => {
    const t = tip(); if (!t) return;
    const r = t.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
    t.style.left = Math.max(8, x) + 'px'; t.style.top = Math.max(8, y) + 'px';
  };
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    const t = tip(); if (!t) return;
    if (!el) { if (cur) { t.classList.remove('on'); cur = null; } return; }
    if (el !== cur) { cur = el; t.innerHTML = el.getAttribute('data-tip'); t.classList.add('on'); }
    place(e);
  }, { passive: true });
  document.addEventListener('scroll', () => { const t = tip(); if (t) t.classList.remove('on'); cur = null; }, { passive: true, capture: true });
})();

  wrap.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${hid}"><form novalidate autocomplete="off"><div class="modal-h"><h2 id="${hid}">${esc(title)}</h2><button type="button" class="btn ghost icon-btn" data-close aria-label="Close">${icon('x')}</button></div><div class="modal-b">${body}</div>${foot}</form></div>`;
  document.body.appendChild(wrap);
  const form = wrap.querySelector('form');
  const m = { wrap, form, onClose, prevFocus: document.activeElement };
  m.close = () => closeModal(m);
  modalStack.push(m);
  wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) m.close(); });
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { e.preventDefault(); m.close(); } });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (btn) btn.disabled = true;
    try {
      const r = await onSubmit(new FormData(form), form, m, e.submitter || null);
      if (r !== false) m.close();
    } catch (err) { console.error(err); toast(err.message || 'Something went wrong', 'err'); }
    finally { if (btn) btn.disabled = false; }
  });
  if (onOpen) onOpen(form, m);
  setTimeout(() => {
    const f = form.querySelector('[autofocus]') || form.querySelector('.modal-b input:not([type=hidden]):not([type=radio]):not([type=checkbox]):not([type=file]), .modal-b select, .modal-b textarea');
    if (f) f.focus();

}
function closeModal(m) {

/* Apply documents another device (or Claude, from chat) just changed. */
function applyRemote(ids) {
  if (!S) return;
  const docs = Cloud.docs;
  const fresh = stateFromDocs(docs);
  if (!fresh) return;
  const months = new Set(), years = new Set();
  let inboxGrew = 0;
  for (const id of ids) {
    if (id === 'config') for (const k of ['settings', 'categories', 'paymentMethods', 'businesses', 'bizCats', 'rules', 'recurring', 'reports']) S[k] = fresh[k];
    else if (id === 'wealth') for (const k of ['accounts', 'holdings', 'goals', 'snapshots']) S[k] = fresh[k];
    else if (id === 'inbox') { inboxGrew = fresh.inbox.length - S.inbox.length; S.inbox = fresh.inbox; }
    else if (id.startsWith('tx-')) months.add(id.slice(3, 10));
    else if (id.startsWith('trips-')) years.add(id.slice(6, 10));
  }
  if (months.size) S.transactions = S.transactions.filter((t) => !months.has(t.date.slice(0, 7))).concat(fresh.transactions.filter((t) => months.has(t.date.slice(0, 7))));
  if (years.size) S.trips = S.trips.filter((t) => !years.has(t.date.slice(0, 4))).concat(fresh.trips.filter((t) => years.has(t.date.slice(0, 4))));
  render();
  if (inboxGrew > 0) toast(`${plural(inboxGrew, 'new item')} in your inbox`, '', { label: 'Review', fn: () => go('import') });
}

  if (e.key === 'Escape' && modalStack.length) { e.preventDefault(); closeModal(modalStack[modalStack.length - 1]); return; }
  if (e.key === 'Tab' && modalStack.length) {
    const m = modalStack[modalStack.length - 1];
    const f = $$('button:not([disabled]), input:not([disabled]):not([type=hidden]), select, textarea, a[href]', m.wrap).filter((x) => x.offsetParent !== null);
    if (f.length) {
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {

  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); txModal(); }

      ${UI.field('Business use %', `<input class="input" type="number" name="bizPct" min="1" max="100" step="1" value="${esc(b.pct ?? 100)}">`, { cls: 'f-exp', hint: 'Mixed-use items (phone, internet) are often partly deductible.' })}
      ${UI.field('Prop firm', `<select class="select" name="firmSel" data-firm-sel>${firmOptions(b.firm || '')}</select>
        <input class="input" name="firm" data-firm-other maxlength="60" value="${esc(b.firm || '')}" placeholder="Firm name" style="margin-top:8px" hidden>`, { cls: 'f-firm', hint: 'Powers the prop firm ROI tracker.' })}

}
function bizSync(form, type, catId) {
  const box = form.querySelector('[data-biz-box]');
  if (!box) return;
  box.hidden = type === 'transfer';
  const on = form.elements.isBiz.checked;
  box.querySelector('[data-biz-fields]').hidden = !on;
  box.querySelector('[data-biz-label]').textContent = type === 'income' ? 'Business income (payout, commission)' : 'Business expense · tax write-off';
  const bizId = form.elements.bizB.value;
  const b = bizOf(bizId);
  $$('.f-exp', box).forEach((el) => { el.hidden = type !== 'expense'; });
  // The firm only matters when the transaction is actually prop firm
  // activity, so it follows the chosen category rather than sitting in the
  // business box for every expense.
  const catName = (catOf(catId) || {}).name || '';
  const wantsFirm = /^prop firm$/i.test(catName) || /^trading payouts$/i.test(catName);
  $$('.f-firm', box).forEach((el) => { el.hidden = !wantsFirm; });
  const fSel = form.elements.firmSel;
  const fOther = box.querySelector('[data-firm-other]');
  if (fSel && fOther) {
    const other = fSel.value === '__other';
    fOther.hidden = !other;
    // The text box is the value when Other is chosen; otherwise the select is.
    if (!other) fOther.value = fSel.value;
  }
  const sel = form.elements.bizC;
  const cur = sel.value;
  const cats = bizCatsFor(bizId);
  sel.innerHTML = UI.options(cats, cats.some((c) => c.id === cur) ? cur : '', { empty: 'Choose category' });
}
function bizFill(form, biz, type) {
  form.elements.isBiz.checked = !!biz;
  if (biz) {
    if (bizOf(biz.b)) form.elements.bizB.value = biz.b;
    bizSync(form, type, form.elements.cat ? form.elements.cat.value : '');
    if (biz.c) form.elements.bizC.value = biz.c;
    form.elements.bizPct.value = biz.pct ?? 100;
    setFirmFields(form, biz.firm || '');
  }
  bizSync(form, type, form.elements.cat ? form.elements.cat.value : '');
}
function readBiz(fd, type) {
  if (type === 'transfer' || !fd.get('isBiz')) return null;
  const b = String(fd.get('bizB') || '');
  if (!bizOf(b)) throw new Error('Choose a business');
  const kind = bizOf(b).kind;
  const biz = {
    b, c: type === 'expense' ? String(fd.get('bizC') || '') : '',
    pct: type === 'expense' ? clamp(Math.round(Number(fd.get('bizPct')) || 100), 1, 100) : 100,
    firm: firmFromForm(fd),
    rnote: type === 'expense' ? String(fd.get('rnote') || '').trim().slice(0, 120) : '',
  };
  if (type === 'expense' && !biz.c) throw new Error('Choose a write-off category');
  return biz;
}
function pmOptions(selected) {
  const list = S.paymentMethods.filter((p) => !p.archived || p.id === selected);
  return UI.options(list, selected, { empty: 'Not specified', label: (p) => p.name + (p.last4 ? ` ··${p.last4}` : '') });
}
const typeSeg = (name, value, kinds = ['expense', 'income', 'transfer']) => `<div class="seg" role="radiogroup" aria-label="Type">${kinds.map((k) => `<label><input type="radio" name="${name}" value="${k}" ${value === k ? 'checked' : ''}><span>${k[0].toUpperCase() + k.slice(1)}</span></label>`).join('')}</div>`;
function fallbackCat(type) {
  const list = catsOfKind(type);
  return (list.find((c) => /^other/i.test(c.name)) || list[0] || {}).id || '';
}

function txModal(tx = null, preset = {}, opts = {}) {
  const isNew = !tx || !tx.id;
  const fromInbox = opts.inboxId || '';
  const t = JSON.parse(JSON.stringify(tx || { date: todayStr(), type: 'expense', amount: 0, desc: '', cat: '', pm: S.settings.lastPm || '', notes: '', tags: [], biz: null, ...preset }));
  if (!pmOf(t.pm)) t.pm = '';
  const descs = [...new Set(sortTx(S.transactions).map((x) => x.desc).filter(Boolean))].slice(0, 400);
  const body = `
    <div style="margin-bottom:16px">${typeSeg('type', t.type)}</div>
    <div class="form-grid">
      ${UI.field('Amount', UI.moneyInput('amount', t.amount, { lg: true, required: true }))}
      ${UI.field('Date', `<input class="input" style="height:50px" type="date" name="date" value="${esc(t.date)}" required>`)}
      ${UI.field('Description', `<input class="input" name="desc" list="dl-desc" maxlength="120" value="${esc(t.desc)}" placeholder="e.g. TradingView, H-E-B, Topstep eval">`, { cls: 'full' })}
      <datalist id="dl-desc">${descs.map((d) => `<option value="${esc(d)}">`).join('')}</datalist>
      <div class="field" data-f-cat><span class="label">Category</span><select class="select" name="cat" aria-label="Category">${UI.options(catsOfKind(t.type === 'transfer' ? 'expense' : t.type), t.cat, { empty: 'Choose category' })}</select></div>
      ${UI.field('Paid with', `<select class="select" name="pm">${pmOptions(t.pm)}</select>`, { hint: S.paymentMethods.length ? '' : 'Add cards under Cards & Accounts to track which one you used.' })}
      ${UI.field('Notes', `<input class="input" name="notes" maxlength="500" value="${esc(t.notes)}" placeholder="Optional">`)}
      ${UI.field('Tags', `<input class="input" name="tags" maxlength="120" value="${esc((t.tags || []).join(', '))}" placeholder="Optional, comma separated">`)}
    </div>
    ${bizBoxHTML(t.biz, t.type)}
    <p class="note" data-autofill hidden style="margin-top:12px">${icon('zap')}<span></span></p>
    <label class="check" style="margin-top:14px"><input type="checkbox" name="mkRule"> <span>Always categorize “<span data-rule-desc>${esc(t.desc || 'this description')}</span>” this way <span class="muted">— including ones already in your books</span></span></label>`;
  const footerLeft = fromInbox ? `<button type="button" class="btn danger" data-close data-act="ib-del" data-id="${esc(fromInbox)}">${icon('x')}<span class="hide-sm">Discard</span></button>` : isNew ? '' : `<button type="button" class="btn danger" data-close data-act="tx-del" data-id="${esc(t.id)}">${icon('trash')}<span class="hide-sm">Delete</span></button><button type="button" class="btn ghost" data-close data-act="tx-dup" data-id="${esc(t.id)}">${icon('copy')}<span class="hide-sm">Duplicate</span></button>`;
  const footer = `${footerLeft}<span class="spacer"></span><button type="submit" class="btn ${fromInbox ? 'accent' : 'primary'}" style="order:1">${fromInbox ? 'Approve' : isNew ? 'Add' : 'Save'}</button>${isNew && !fromInbox ? '<button type="submit" class="btn" name="another" value="1">Save & add another</button>' : '<button type="button" class="btn" data-close>Cancel</button>'}`;
  openModal({
    title: fromInbox ? 'Review imported transaction' : isNew ? 'New transaction' : 'Edit transaction', body, footer,
    onOpen(form) {
      const el = form.elements;
      let pctTouched = !isNew;
      const typeNow = () => form.querySelector('[name=type]:checked').value;
      const sync = () => {
        const type = typeNow();
        form.querySelector('[data-f-cat]').hidden = type === 'transfer';
        if (type !== 'transfer') {
          const cur = el.cat.value; const list = catsOfKind(type);
          el.cat.innerHTML = UI.options(list, list.some((c) => c.id === cur) ? cur : '', { empty: 'Choose category' });
        }
        bizSync(form, type, el.cat.value);
      };
      const note = (msg) => { const n = form.querySelector('[data-autofill]'); n.hidden = !msg; n.querySelector('span').textContent = msg || ''; };
      const touched = new Set();
      let lastKey = '';
      const autofill = () => {
        if (!isNew) return;
        const desc = el.desc.value;
        const rule = matchRule(desc);
        const src = rule ? { cat: rule.cat, pm: rule.pm, biz: rule.biz } : lastTxLike(desc);
        const key = rule ? 'r' + rule.id : src ? 't' + src.id : '';
        if (key === lastKey) return;
        lastKey = key;
        if (!src) { note(''); return; }
        const c = catOf(src.cat);
        if (c && !touched.has('type') && c.kind !== typeNow()) { const r = form.querySelector(`[name=type][value=${c.kind}]`); if (r) r.checked = true; }
        sync();
        if (c && !touched.has('cat') && c.kind === typeNow()) el.cat.value = c.id;
        if (src.pm && pmOf(src.pm) && !touched.has('pm') && (!rule || !el.pm.value)) el.pm.value = src.pm;
        if (!rule && !el.amount.value && src.amount) el.amount.value = centsToInput(src.amount);
        if (!touched.has('isBiz') && !touched.has('bizB') && !touched.has('bizC')) { bizFill(form, src.biz ? { ...src.biz } : null, typeNow()); pctTouched = true; }
        note(rule ? `Auto-filled by your rule “${rule.match}”.` : `Auto-filled from your last “${src.desc}” (${fmtDate(src.date)}).`);
      };
      const autofillSoon = debounce(autofill, 220);
      el.desc.addEventListener('input', autofillSoon);
      form.addEventListener('change', (e) => {
        const n = e.target.name;
        if (e.isTrusted && ['type', 'cat', 'pm', 'isBiz', 'bizB', 'bizC'].includes(n)) touched.add(n);
        if (['cat', 'isBiz', 'bizB', 'firmSel'].includes(n)) bizSync(form, typeNow(), el.cat.value);
        if (n === 'type' || n === 'isBiz' || n === 'bizB') sync();
        if (n === 'bizPct') pctTouched = true;
        if (n === 'bizC' && !pctTouched) { const bc = bizCatOf(e.target.value); if (bc) el.bizPct.value = bc.pct; }
        if (n === 'desc') autofill();
      });
      el.desc.addEventListener('input', () => { form.querySelector('[data-rule-desc]').textContent = el.desc.value || 'this description'; });
      sync();
      if (t.biz && t.biz.c) el.bizC.value = t.biz.c;
      if (isNew) setTimeout(() => el.amount.focus(), 40);
    },
    onSubmit(fd, form, m, submitter) {
      const type = String(fd.get('type'));
      const amount = parseMoney(fd.get('amount'));
      if (!(amount > 0)) { form.elements.amount.classList.add('invalid'); toast('Enter an amount greater than 0', 'err'); return false; }
      const date = String(fd.get('date'));
      if (!validDate(date)) { toast('Pick a valid date', 'err'); return false; }
      const cat = type === 'transfer' ? '' : String(fd.get('cat') || '') || fallbackCat(type);
      let biz;
      try { biz = readBiz(fd, type); } catch (e) { toast(e.message, 'err'); return false; }
      let desc = String(fd.get('desc') || '').trim();
      if (!desc) desc = type === 'transfer' ? 'Transfer' : (catOf(cat) || {}).name || 'Transaction';
      const rec = {
        id: isNew ? uid() : t.id, created: isNew ? Date.now() : t.created || Date.now(),
        date, type, amount, desc, cat, pm: String(fd.get('pm') || ''),
        notes: String(fd.get('notes') || '').trim(),
        tags: String(fd.get('tags') || '').split(',').map((s) => s.trim()).filter(Boolean).slice(0, 12),
        biz, ...(t.rec ? { rec: t.rec } : {}), ...(t.fitid ? { fitid: t.fitid } : {}),
      };
      const another = !!(submitter && submitter.name === 'another');
      let retro = [];
      commit(() => {
        if (fromInbox) S.inbox = S.inbox.filter((i) => i.id !== fromInbox);
        if (isNew) S.transactions.push(rec);
        else { const i = S.transactions.findIndex((x) => x.id === t.id); if (i >= 0) S.transactions[i] = rec; else S.transactions.push(rec); }
        if (rec.pm) S.settings.lastPm = rec.pm;
        if (fd.get('mkRule') && desc && type !== 'transfer') {
          const m = norm(desc);
          const existing = S.rules.find((r) => norm(r.match) === m);
          const rule = { id: existing ? existing.id : uid(), match: desc.toLowerCase(), cat, pm: rec.pm, biz: biz ? { b: biz.b, c: biz.c, pct: biz.pct, firm: biz.firm } : null };
          if (existing) Object.assign(existing, rule); else S.rules.push(rule);
          // Reach backwards too: a rule the person just set is almost always
          // meant to describe what this merchant has always been, not only
          // what it will be from now on.
          retro = applyRuleToPast(rule, rec.id);
        }
      }, fromInbox ? `Approved ${desc}` : isNew ? `Added ${money(type === 'income' ? amount : -amount)} · ${desc}` : 'Transaction updated');
      if (retro.length) {
        const snaps = retro;
        toast(`${plural(snaps.length, 'earlier transaction')} updated to match`, '', {
          label: 'Undo',
          fn: () => commit(() => undoRuleToPast(snaps), `${plural(snaps.length, 'transaction')} put back`),
        });
      }
      // Changing a category on one row almost always means the same merchant
      // was miscategorised everywhere. The rule checkbox does this, but it is
      // opt-in and easy to miss, so when the others are still on a different
      // category we say so and offer to fix them. Offered, not applied: this
      // rewrites rows the person is not looking at.
      if (!isNew && !fromInbox && !retro.length && desc && type !== 'transfer') {
        const m = norm(desc);
        const others = S.transactions.filter((x) => x.id !== rec.id
          && x.type === rec.type && norm(x.desc) === m && x.cat !== rec.cat);
        if (others.length) {
          const asRule = { match: desc, cat: rec.cat, pm: '', biz: rec.biz ? { ...rec.biz } : null };
          toast(`${plural(others.length, 'other')} “${desc}” ${others.length === 1 ? 'transaction is' : 'transactions are'} categorised differently`, '', {
            label: 'Fix them too',
            fn: () => {
              let snaps = [];
              commit(() => { snaps = applyRuleToPast(asRule, rec.id); }, '');
              toast(`${plural(snaps.length, 'transaction')} updated`, '', {
                label: 'Undo',
                fn: () => commit(() => undoRuleToPast(snaps), `${plural(snaps.length, 'transaction')} put back`),
              });
            },
          });
        }
      }
      if (another) setTimeout(() => txModal(null, { date, type, pm: rec.pm }), 0);
    },
  });
}
ACT['tx-add'] = () => txModal();
ACT['tx-edit'] = (el) => { const t = byId(S.transactions, el.dataset.id); if (t) txModal(t); };

ACT['tx-del'] = (el) => {

  const removed = S.transactions[i];
  commit(() => S.transactions.splice(i, 1), 'Transaction deleted', { label: 'Undo', fn: () => commit(() => S.transactions.push(removed), 'Restored') });
};

ACT['tx-del-selected'] = async () => {

  if (!(await confirmDialog({ title: `Delete ${plural(ids.length, 'transaction')}?`, message: 'They are removed from your books. You can undo right after.', confirmText: 'Delete', danger: true }))) return;
  const idSet = new Set(ids);
  const removed = S.transactions.filter((t) => idSet.has(t.id));
  ui.txSel.clear();
  commit(() => { S.transactions = S.transactions.filter((t) => !idSet.has(t.id)); }, `Deleted ${plural(removed.length, 'transaction')}`, { label: 'Undo', fn: () => commit(() => S.transactions.push(...removed)) });
};

      labels: paceLabels,

      tipTitle: (i) => ui.paceRange === 'month' ? `Day ${i + 1}` : paceLabels[i],
    }), 220), { sub: `Cumulative spending vs ${ui.paceRange === 'month' ? 'last month' : ui.paceRange === 'quarter' ? 'last quarter' : 'last year'}`, cls: 's7', actions: paceSeg });

    // top categories w/ budget markers
    const sp = spendByCat(mk);
    const top = [...sp.entries()].sort((a, b) => b[1] - a[1]).slice(0, 7).map(([id, v]) => {

    });

    }).join('')}</div>` : UI.empty('repeat', 'Nothing due soon', 'Add rent, subscriptions and data fees to see what is coming.', '<button class="btn sm" data-act="rec-add">Add a bill</button>'), { sub: 'Next 14 days', cls: 's4', actions: '<button class="btn sm ghost" data-act="go" data-view="recurring">All</button>' });

    // recent

    // by payment method
    const byPm = new Map();
    for (const x of S.transactions) if (x.type === 'expense' && x.date.startsWith(mk)) byPm.set(x.pm || '', (byPm.get(x.pm || '') || 0) + x.amount);
    const pmItems = [...byPm.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id, v]) => { const pm = pmOf(id); return { label: pm ? pm.name : 'Not specified', value: v, color: pm ? colorVar(pm.color) : 'var(--muted)', tip: [tipRow('Spent', money(v)), ...(pm && pm.last4 ? [tipRow('Card', '•••• ' + pm.last4)] : [])] }; });

function txFiltered() {
  const f = ui.tx; const q = norm(f.q);
  return S.transactions.filter((t) => {
    if (f.scope === 'month' && !t.date.startsWith(ui.month)) return false;
    if (f.scope === 'year' && !t.date.startsWith(ui.month.slice(0, 4))) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.pm === '_none' && t.pm) return false;
    if (f.pm && f.pm !== '_none' && t.pm !== f.pm) return false;
    if (f.biz === 'business' && !t.biz) return false;
    if (f.biz === 'personal' && t.biz) return false;
    if (f.biz && f.biz !== 'business' && f.biz !== 'personal' && (!t.biz || t.biz.b !== f.biz)) return false;
    if (q) {
      const c = catOf(t.cat), p = pmOf(t.pm);
      const hay = [t.desc, t.notes, (t.tags || []).map((x) => '#' + x).join(' '), c && c.name, p && p.name, p && p.last4, t.biz && t.biz.firm, money(t.amount), (t.amount / 100).toFixed(2)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort(txSorter(ui.txSort));
}
function txRow(t) {
  const c = catOf(t.cat);
  const firm = t.biz && t.biz.firm ? t.biz.firm : '';
  const sub = [firm, t.notes, (t.tags || []).map((x) => '#' + x).join(' ')].filter(Boolean).join(' · ');
  const a = t.type === 'income' ? amt(t.amount, { sign: true }, 'pos') : t.type === 'transfer' ? `<span class="muted amt">${esc(money(t.amount))}</span>` : amt(-t.amount);
  return `<tr class="click" data-act="tx-edit" data-id="${t.id}">
    <td class="cb"><input type="checkbox" onclick="event.stopPropagation()" data-change="tx-sel" data-id="${t.id}" ${ui.txSel.has(t.id) ? 'checked' : ''} aria-label="Select ${esc(t.desc)}"></td>
    <td class="nowrap muted hide-sm">${fmtDate(t.date)}</td>
    <td><div class="desc">${esc(t.desc)}</div>${sub ? `<div class="sub hide-sm">${esc(sub)}</div>` : ''}<div class="sub show-sm">${esc([fmtDate(t.date), t.type === 'transfer' ? 'Transfer' : c ? c.name : '', t.biz ? 'Business' : ''].filter(Boolean).join(' · '))}</div></td>
    <td class="hide-sm">${t.type === 'transfer' ? '<span class="badge">Transfer</span>' : UI.cat(c)}</td>
    <td class="hide-md">${UI.pm(pmOf(t.pm))}</td>
    <td class="hide-sm">${UI.bizBadge(t)}</td>
    <td class="num">${a}</td>
    <td class="actions hide-sm"><span class="row-actions"><button class="btn ghost icon-btn sm" data-act="tx-dup" data-id="${t.id}" aria-label="Duplicate" title="Duplicate">${icon('copy')}</button><button class="btn ghost icon-btn sm" data-act="tx-del" data-id="${t.id}" aria-label="Delete" title="Delete">${icon('trash')}</button></span></td>
  </tr>`;
}

      <header class="card-h" style="padding:16px 18px 6px"><div><h3>Monthly budgets</h3><p class="card-sub">Budgets repeat every month. ${isCur ? 'The thin line shows an even spending pace for today.' : ''}</p></div><div class="card-actions"><button class="btn sm" data-act="budget-suggest">${icon('zap')}Suggest from last 3 months</button><button class="btn sm ghost" data-act="cat-add" data-kind="expense">${icon('plus')}Category</button></div></header>

CHG['budget-set'] = (el) => {

/* ---------- Auto-detect bills & subs from connected banks ----------
   Plaid derives recurring streams from the transaction history it holds for
   each Item (/api/recurring on the Bank Sync server). Detection quality
   depends on how much history was requested when the bank was linked —
   Plaid advises at least 180 days, so banks linked with the old 90-day
   default will find little until they're reconnected.

   Streams already pulled in are matched by stream id, so re-running updates
   amount/next-date in place rather than piling up duplicates. Anything you
   edited yourself (category, card, business split) is preserved on update —
   only the figures Plaid owns get refreshed. */
const PLAID_FREQ = {
  WEEKLY: 'weekly',
  BIWEEKLY: 'biweekly',
  // The app has no semi-monthly option; biweekly is the closest of what it
  // does have (24/yr vs 26/yr, so the monthly estimate runs ~8% high).
  SEMI_MONTHLY: 'biweekly',
  MONTHLY: 'monthly',
  ANNUALLY: 'yearly',
};

function streamToRecurring(st) {
  const type = st.direction === 'in' ? 'income' : 'expense';
  const freq = PLAID_FREQ[st.frequency] || 'monthly';
  const raw = st.average_amount && typeof st.average_amount.amount === 'number'
    ? st.average_amount.amount
    : (st.last_amount || {}).amount;
  const amount = Math.round(Math.abs(Number(raw) || 0) * 100);
  if (!amount) return null;

  const desc = cleanDesc(st.merchant_name || st.description || 'Recurring');
  let next = st.predicted_next_date;
  if (!validDate(next)) next = validDate(st.last_date) ? nextDate(st.last_date, freq, 0) : todayStr();
  // A predicted date that has already passed is stale; roll it forward so the
  // item doesn't land in "due now" the moment it's imported.
  let guard = 0;
  while (next < todayStr() && guard++ < 36) next = nextDate(next, freq, 0);

  let cat = '', biz = null;
  const rule = matchRule(desc);
  if (rule) {
    const rc = catOf(rule.cat);
    if (rc && rc.kind === type) cat = rule.cat;
    if (rule.biz) biz = { ...rule.biz };
  }
  // A rule can set a business without naming a firm. Attach the firm on
  // top of it rather than treating the row as already handled — every
  // prop firm charge is business activity.
  const pfTmp = { type, desc, biz };
  if (ensurePropFirmBiz(pfTmp)) {
    biz = pfTmp.biz;
    if (!cat) { const wantName = type === 'income' ? 'Trading payouts' : 'Prop firm'; const c = byName(catsOfKind(type), wantName); if (c) cat = c.id; }
  }
  if (!cat) {
    const mapped = categorizeFromPFC(st.personal_finance_category);
    if (mapped.category) { const c = byName(catsOfKind(type), mapped.category); if (c) cat = c.id; }
  }
  if (!cat) cat = fallbackCat(type);

  const pm = pmByLast4(st.account_mask);
  return {
    id: uid(), sid: st.stream_id, name: desc, type, amount, freq, next,
    anchor: Number(next.slice(8)) || 0, cat, pm: pm ? pm.id : '', biz,
    active: st.is_active !== false,
  };
}

ACT['rec-detect'] = async () => {
  const job = newJob('Finding bills & subscriptions', 'banksync');
  try {
    const res = await fetch('/api/recurring');
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    if (!res.ok) throw new Error(`Bank Sync returned ${res.status}`);
    const { streams = [], errors = [] } = await res.json();

    const live = streams.filter((st) => st.status !== 'TOMBSTONED');
    const bySid = new Map(S.recurring.filter((r) => r.sid).map((r) => [r.sid, r]));
    const added = [];
    let updated = 0, known = 0;

    for (const st of live) {
      const mapped = streamToRecurring(st);
      if (!mapped) continue;
      const existing = bySid.get(st.stream_id);
      if (existing) {
        // Refresh only what Plaid owns; keep the user's own categorisation.
        existing.amount = mapped.amount;
        existing.freq = mapped.freq;
        existing.next = mapped.next;
        existing.active = mapped.active;
        updated++;
        continue;
      }
      // Don't duplicate a bill that was already entered by hand.
      const manual = S.recurring.find((r) => !r.sid && nameKey(r.name) === nameKey(mapped.name));
      if (manual) { manual.sid = st.stream_id; known++; continue; }
      added.push(mapped);
    }

    if (added.length || updated || known) {
      commit(() => { if (added.length) S.recurring.push(...added); }, '');
    }

    const parts = [];
    if (added.length) parts.push(`${plural(added.length, 'new bill')} found`);
    if (updated) parts.push(`${updated} updated`);
    if (known) parts.push(`${known} already tracked`);
    if (!parts.length) parts.push(live.length ? 'Nothing new' : 'No recurring patterns detected yet');
    if (errors.length) parts.push(`${plural(errors.length, 'bank')} could not be read`);

    jobUpdate(job, { status: 'done', ended: Date.now(), msg: parts.join(' · ') });
    render();
    toast(parts.join(' · '));
    if (!live.length && !errors.length) {
      toast('Plaid needs a few months of history to spot patterns. Banks linked before the history setting existed only have 90 days — reconnect them to get more.', '', { label: 'Bank Sync', fn: () => { window.location.href = '/'; } });
    }
  } catch (e) {
    console.error(e);
    failJob(job, e);
    toast('Could not reach Bank Sync — is it running?', 'err');
  }
};

// Card payments as an issuer words them. There are a dozen variants but
// nearly all of them say "payment" somewhere.
const CARD_PAYMENT_RE = /payment thank|thank you for your payment|autopay|auto pay|online payment|mobile payment|epay|e-pay|payment received|card payment|cc payment|pymt|bal tran/i;

// Guess a card's due day from when its payments actually land. That is the
// payment date rather than the billed due date: identical for anyone on
// autopay, and the right ballpark otherwise. Median, not mean, so a single
// early or late payment cannot drag it, and never from fewer than two.
function inferDueDay(pmId) {
  const days = [];
  for (const t of S.transactions) {
    if (t.pm !== pmId || !CARD_PAYMENT_RE.test(t.desc || '')) continue;
    const d = Number(String(t.date).slice(8, 10));
    if (d >= 1 && d <= 31) days.push(d);
  }
  if (days.length < 2) return null;
  days.sort((a, b) => a - b);
  // Payments scattered across the month are somebody paying whenever, not a
  // due date. Only claim a day when they cluster.
  const spread = days[days.length - 1] - days[0];
  if (spread > 10 && days.length < 4) return null;
  return { day: days[Math.floor(days.length / 2)], n: days.length };
}

// Interest and fees: the cost of carrying a card rather than anything you
// chose to buy. Caught by category where Plaid supplied one and by wording
// otherwise, then split — interest is the number worth reacting to, and an
// annual fee is not the same thing.
const INTEREST_RE = /interest charge|finance charge|purchase interest|interest on|int chg|interest assessed/i;
const FEE_RE = /\bfee\b|annual membership|late charge|overlimit|over limit|cash advance|foreign transaction|atm fee|overdraft|nsf/i;
function interestAndFees(year) {
  const out = { interest: 0, fees: 0, total: 0, byCard: new Map(), items: [] };
  for (const t of S.transactions) {
    if (t.type !== 'expense') continue;
    if (year && !String(t.date).startsWith(year)) continue;
    const cat = catOf(t.cat);
    const byCat = !!cat && cat.name === 'Fees & interest';
    const isInterest = INTEREST_RE.test(t.desc || '');
    const isFee = FEE_RE.test(t.desc || '');
    if (!byCat && !isInterest && !isFee) continue;
    const interest = isInterest;
    if (interest) out.interest += t.amount; else out.fees += t.amount;
    out.total += t.amount;
    const key = t.pm || '_none';
    const cur = out.byCard.get(key) || { interest: 0, fees: 0, n: 0 };
    if (interest) cur.interest += t.amount; else cur.fees += t.amount;
    cur.n++;
    out.byCard.set(key, cur);
    out.items.push({ t, interest });
  }
  out.items.sort((a, b) => (a.t.date < b.t.date ? 1 : -1));
  return out;
}

function nextDue(day) {
  if (!day) return null;
  const t = parseD(todayStr());
  const mk = (y, m) => { const dim = new Date(y, m + 1, 0).getDate(); return dStr(new Date(y, m, Math.min(day, dim))); };
  let d = mk(t.getFullYear(), t.getMonth());
  if (d < todayStr()) d = mk(t.getFullYear(), t.getMonth() + 1);
  return d;
}
/* =========================================================
   Reports
   Every other view answers a question the app chose. This one lets you ask
   your own: a range, some filters, a grouping. Saved reports ride in the
   config document, so they follow you between devices.
   ========================================================= */
function reportRun(r) {
  const rows = S.transactions.filter((t) => {
    if (r.from && t.date < r.from) return false;
    if (r.to && t.date > r.to) return false;
    if (r.type && t.type !== r.type) return false;
    if (r.cat && t.cat !== r.cat) return false;
    if (r.biz === 'business' && !t.biz) return false;
    if (r.biz === 'personal' && t.biz) return false;
    return true;
  });
  const keyOf = (t) => {
    if (r.group === 'category') { const c = catOf(t.cat); return c ? c.name : 'Uncategorised'; }
    if (r.group === 'card') { const p = pmOf(t.pm); return p ? p.name : 'No card'; }
    if (r.group === 'firm') return (t.biz && t.biz.firm) || 'No firm';
    return t.date.slice(0, 7);
  };
  const groups = new Map();
  for (const t of rows) {
    const k = keyOf(t);
    const cur = groups.get(k) || { total: 0, n: 0 };
    cur.total += t.amount; cur.n++;
    groups.set(k, cur);
  }
  // Months read best in time order; every other grouping reads best biggest first.
  const entries = [...groups.entries()];
  if (r.group === 'month') entries.sort((a, b) => (a[0] < b[0] ? -1 : 1));
  else entries.sort((a, b) => b[1].total - a[1].total);
  const total = sum(rows, (t) => t.amount);
  return { rows, entries, total, count: rows.length, avg: rows.length ? Math.round(total / rows.length) : 0 };
}

  const unique = new Set(pms.map((p) => p.color)).size === pms.length;
  const series = pms.map((p, i) => ({ name: p.name, color: unique ? colorVar(p.color) : `var(--c${i})`, values: vals(p.id) }));
  return UI.card('Spending by card', legend(series.map((x) => [x.name, x.color])) + chartSlot(columnsChart({ labels: months.map(monthShort), series, tipTitle: (i) => monthLabel(months[i]) }), 220), { cls: 's8', sub: 'Last 6 months' + (S.paymentMethods.filter((p) => !p.archived).length > 4 ? ' · first 4 cards' : '') });

function pmBizCard(y) {

  const by = new Map();
  for (const t of biz) by.set(t.pm || '', (by.get(t.pm || '') || 0) + t.amount);
  const items = [...by.entries()].sort((a, b) => b[1] - a[1]).map(([id, v]) => { const p = pmOf(id); return { label: p ? p.name : 'Not specified', value: v, color: p ? colorVar(p.color) : 'var(--muted)' }; });
  return UI.card(`Business spending by card · ${y}`, items.length ? hbars(items) + (items.length > 1 ? `<p class="note" style="margin-top:14px">${icon('info')}<span>Tip: running business costs through one dedicated card makes tax time and bookkeeping much easier.</span></p>` : '') : '<p class="muted small">No business expenses yet.</p>', { cls: 's4' });
}

/* =========================================================
   Import Center: AI reading (screenshots, PDFs, receipts, pasted text),
   bank files (CSV, OFX/QFX), and the review inbox.
   Every import lands in the inbox; nothing reaches the books until approved.
   ========================================================= */
const IMP = { jobs: [], tick: null };
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const SOURCE_LABEL = { screenshot: 'Screenshot', statement: 'Statement', receipt: 'Receipt', csv: 'CSV', ofx: 'Bank file', paste: 'Pasted', chat: 'From chat', manual: 'Manual' };
// Two ways to reach Claude: the host page supplies it when the Ledger runs
// inside claude.ai, otherwise this deployment relays through its own server.
const SERVER_AI = { enabled: false, checked: false };
const aiReady = () => !!Cloud.caps.sample || SERVER_AI.enabled;
const imgReady = () => !!(Cloud.caps.limits && Cloud.caps.limits.images);

/* ---------- helpers ---------- */
function maskDigits(s) {
  return String(s || '').replace(/(?:\d[ -]?){7,}\d/g, (m) => '••' + m.replace(/\D/g, '').slice(-4));
}
function cleanDesc(s) { return maskDigits(String(s || '').replace(/\s+/g, ' ').trim()).slice(0, 120); }
const nameKey = (s) => norm(s).replace(/[^a-z0-9]+/g, ' ').trim();
function byName(list, name) {
  const k = nameKey(name); if (!k) return null;
  return list.find((x) => nameKey(x.name) === k) || list.find((x) => nameKey(x.name).startsWith(k) || k.startsWith(nameKey(x.name))) || null;
}
const pmByLast4 = (l4) => { const d = String(l4 || '').replace(/\D/g, '').slice(-4); return d.length === 4 ? S.paymentMethods.find((p) => p.last4 === d && !p.archived) || S.paymentMethods.find((p) => p.last4 === d) : null; };
function tokens(s) { return new Set(nameKey(s).split(' ').filter((w) => w.length >= 3 && !/^\d+$/.test(w))); }
function similarDesc(a, b) {
  const A = tokens(a), B = tokens(b);
  if (!A.size || !B.size) return false;
  for (const w of A) if (B.has(w)) return true;
  const na = nameKey(a), nb = nameKey(b);
  return na.includes(nb) || nb.includes(na);
}
function findDuplicate(date, cents, desc) {
  return S.transactions.find((t) => t.amount === cents && Math.abs(daysBetween(t.date, date)) <= 3 && (t.date === date || similarDesc(t.desc, desc))) || null;
}

/* Resolve an inbox item (page-made items carry ids; items written from chat carry names). */
function itemType(it) { return it.type === 'income' || it.type === 'transfer' ? it.type : it.direction === 'in' ? 'income' : 'expense'; }
function itemCents(it) { return Number.isFinite(it.amountCents) ? Math.abs(Math.round(it.amountCents)) : Math.abs(Math.round(Number(it.amount) * 100)) || 0; }
function resolveItem(it) {
  // Same override as the bank-sync path: a prop firm payout is income, not an
  // internal transfer, however Plaid categorised it.
  const rawType = itemType(it);
  const type = rawType === 'transfer' && detectPropFirmName(it.desc || it.description || '')
    ? (it.direction === 'out' ? 'expense' : 'income')
    : rawType;
  let cat = it.cat && catOf(it.cat) ? it.cat : '';
  if (!cat && it.category && type !== 'transfer') { const c = byName(catsOfKind(type), it.category); if (c) cat = c.id; }
  let pm = it.pm && pmOf(it.pm) ? it.pm : '';
  if (!pm) { const p = pmByLast4(it.paymentLast4 || it.pmHint) || (it.paymentMethod ? byName(S.paymentMethods, it.paymentMethod) : null); if (p) pm = p.id; }
  let biz = it.biz && bizOf(it.biz.b) ? { ...it.biz } : null;
  if (!biz && it.business && type !== 'transfer') {
    const b = byName(S.businesses, it.business) || S.businesses.find((x) => norm(it.business).includes(x.kind));
    if (b) {
      const bc = type === 'expense' ? byName(bizCatsFor(b.id), it.writeoff) : null;
      biz = { b: b.id, c: bc ? bc.id : '', pct: clamp(Number(it.pct ?? (bc ? bc.pct : 100)) || 100, 1, 100), firm: b.kind === 'trading' ? String(it.firm || '').slice(0, 60) : '' };
    }
  }
  const desc = cleanDesc(it.desc || it.description || 'Imported');
  if (!biz && type !== 'transfer') {
    const pf = propFirmBizFor(desc, type);
    if (pf) { biz = pf; if (!cat) { const wantName = type === 'income' ? 'Trading payouts' : 'Prop firm'; const c = byName(catsOfKind(type), wantName); if (c) cat = c.id; } }
  }
  if (biz && type === 'expense' && !biz.c) { const other = bizCatsFor(biz.b).find((c) => /^other/i.test(c.name)); if (other) biz.c = other.id; }
  const date = validDate(it.date) ? it.date : todayStr();
  return { type, cat, pm, biz, date, cents: itemCents(it), desc };
}
function applyRulesTo(item) {
  const rule = matchRule(item.desc);
  if (!rule) return false;
  const c = catOf(rule.cat);
  if (c && (item.type === 'transfer' ? false : c.kind === item.type)) item.cat = c.id;
  if (rule.pm && !item.pm) item.pm = rule.pm;
  if (rule.biz && item.type !== 'transfer') item.biz = { ...rule.biz };
  item.rule = rule.match;
  return true;
}

/* Turn extracted rows into inbox items (ids resolved, rules applied, duplicates flagged). */
function addToInbox(rows, meta) {
  const added = []; let dups = 0, skipped = 0;
  const existingKeys = new Set(S.inbox.map((i) => `${i.date}|${itemCents(i)}|${nameKey(i.desc)}`));
  for (const r of rows) {
    const it = { id: 'i' + uid(), source: meta.source, file: meta.file || '', addedAt: new Date().toISOString(), ...r };
    const res = resolveItem(it);
    if (!(res.cents > 0) || !validDate(it.date)) { skipped++; continue; }
    Object.assign(it, { date: res.date, desc: res.desc, type: res.type, cat: res.cat, pm: res.pm || (meta.pm || ''), biz: res.biz, amount: res.cents / 100 });
    delete it.amountCents; delete it.category; delete it.business; delete it.writeoff; delete it.description; delete it.direction;
    if (!it.pm && meta.last4) it.pmHint = meta.last4;
    applyRulesTo(it);
    if (it.fitid && S.transactions.some((t) => t.fitid === it.fitid)) { dups++; continue; }
    const key = `${it.date}|${res.cents}|${nameKey(it.desc)}`;
    if (existingKeys.has(key)) { dups++; continue; }
    existingKeys.add(key);
    const d = findDuplicate(it.date, res.cents, it.desc);
    if (d) { it.dup = d.id; it.skip = true; dups++; }
    added.push(it);
  }
  const room = INBOX_MAX - S.inbox.length;
  const kept = added.slice(0, Math.max(0, room));
  if (kept.length) commit(() => { S.inbox = kept.concat(S.inbox); });
  if (added.length > kept.length) toast(`Inbox is full. Approve some items, then import the rest.`, 'err');
  return { added: kept.length, dups, skipped };
}

/* ---------- Claude extraction ---------- */
function extractPrompt(kind, text) {
  const exp = catsOfKind('expense').map((c) => c.name).join(' | ');
  const inc = catsOfKind('income').map((c) => c.name).join(' | ');
  const biz = S.businesses.map((b) => {
    const cats = bizCatsFor(b.id).map((c) => c.name).join(' | ');
    return `- "${b.name}" (${b.kind}): write-off categories: ${cats}`;
  }).join('\n');
  const what = {
    screenshot: 'The images are screenshots of a banking, card or payment app (transaction lists or activity pages).',
    statement: 'The input is a bank or credit card statement (text extracted from a PDF, or page images).',
    receipt: 'The image is a photo of a single purchase receipt or invoice. Return exactly one transaction for its total.',
    paste: 'The input is text the user copied from a bank website, an email, or notes.',
  }[kind];
  return `You extract transactions for a personal finance app. Today is ${todayStr()}.
${what}

Reply with ONLY this JSON:
{"account":{"institution":string|null,"last4":string|null,"kind":"credit"|"debit"|"bank"|null},
 "transactions":[{"date":"YYYY-MM-DD","description":string,"amount":number,"direction":"out"|"in","transfer":boolean,
   "category":string,"business":string|null,"writeoff":string|null,"businessPct":number|null,"firm":string|null,"confidence":number}]}

Rules:
- One entry per real transaction. Skip balances, subtotals, headers, interest summaries and anything marked declined.
- amount is a positive number in dollars; direction "out" for purchases, fees and withdrawals, "in" for deposits, refunds, payouts.
- transfer=true for credit card payments, autopay, and moves between the user's own accounts.
- Dates: infer a missing year from the statement period or today's date; never return a future date.
- description: the clean merchant name ("SQ *UCHI HOUSTON TX 0923" -> "Uchi"). Keep prop firm names (Topstep, Apex Trader Funding, Tradeify...) intact.
- category: exactly one of [${exp}] for "out", or one of [${inc}] for "in".
- The user runs these businesses:
${biz}
  Set business + writeoff only when the item is clearly a cost (or income) of one of them: prop firm evaluations, resets, activation and market data fees, trading platforms and indicators, trading courses (trading); insurance leads, licensing and CE, E&O coverage, CRM or dialer tools (insurance). Otherwise null. firm = the prop firm name for trading items, else null.
- account.last4: last 4 digits of the card/account if visible. NEVER output a full card or account number anywhere.
- confidence: 0 to 1, how sure you are about amount, date and direction.${text ? `\n\nINPUT:\n${text}` : ''}`;
}
async function askClaudeJSON(prompt, opts) {
  const sample = Cloud.caps.sample;
  if (!sample) throw { code: 'unavailable', message: 'AI reading works when this page is open on claude.ai.' };
  return sample.json(prompt, opts);
}
function sampleErrorText(e) {
  const c = e && e.code;
  return {
    not_granted: 'Claude access was not allowed for this page.', sampling_disabled: 'Claude is not available for this account.',
    rate_limited: 'Usage limit or too many requests. Try again in a bit.', image_rejected: 'That image could not be read. Try a PNG or JPG screenshot.',
    images_unavailable: 'Image reading is not available in this view.', prompt_too_large: 'That is too much text at once. Try fewer pages.',
    invalid_json: 'Claude\'s answer could not be read. Try again.', refused: 'Claude declined to read this file.', cancelled: 'Stopped.',
    unavailable: 'AI reading works when this page is open on claude.ai.', session_expired: 'Sign in to Claude again.',
  }[c] || (e && e.message) || 'Something went wrong. Try again.';
}

/* ---------- jobs ---------- */
function newJob(name, kind) {
  const job = { id: uid(), name, kind, status: 'working', msg: 'Starting…', started: Date.now(), ctl: new AbortController() };
  IMP.jobs.unshift(job); IMP.jobs = IMP.jobs.slice(0, 8);
  refreshJobs();
  if (!IMP.tick) IMP.tick = setInterval(() => { if (!IMP.jobs.some((j) => j.status === 'working')) { clearInterval(IMP.tick); IMP.tick = null; } refreshJobs(); }, 1000);
  return job;
}
function jobUpdate(job, patch) { Object.assign(job, patch); refreshJobs(); }
function jobsHTML() {
  if (!IMP.jobs.length) return '';
  return `<div class="jobs">${IMP.jobs.map((j) => {
    const secs = Math.round(((j.ended || Date.now()) - j.started) / 1000);
    const ic = j.status === 'working' ? '<span class="spin" aria-hidden="true"></span>' : icon(j.status === 'done' ? 'check' : 'alert');
    return `<div class="job ${j.status}"><div class="job-ic">${ic}</div><div class="li-main"><div class="li-title">${esc(j.name)}</div><div class="li-sub wrap">${esc(j.msg)}${j.status === 'working' ? ` · ${secs}s` : ''}</div></div>${j.status === 'working' ? `<button class="btn sm ghost" data-act="job-stop" data-id="${j.id}">Stop</button>` : `<button class="btn ghost icon-btn sm" data-act="job-clear" data-id="${j.id}" aria-label="Dismiss">${icon('x')}</button>`}</div>`;
  }).join('')}</div>`;
}
function refreshJobs() { const el = $('#imp-jobs'); if (el) el.innerHTML = jobsHTML(); }
ACT['job-stop'] = (el) => { const j = IMP.jobs.find((x) => x.id === el.dataset.id); if (j) j.ctl.abort(); };
ACT['job-clear'] = (el) => { IMP.jobs = IMP.jobs.filter((x) => x.id !== el.dataset.id); refreshJobs(); };
function finishJob(job, res, extra = '') {
  const parts = [`${plural(res.added, 'transaction')} added to inbox`];
  if (res.dups) parts.push(`${res.dups} possible duplicate${res.dups === 1 ? '' : 's'}`);
  if (res.skipped) parts.push(`${res.skipped} unreadable`);
  jobUpdate(job, { status: 'done', ended: Date.now(), msg: parts.join(' · ') + extra });
  if (job.newCard) offerNewCard(job.newCard);
}
function failJob(job, e) { console.error(e); jobUpdate(job, { status: e && e.code === 'cancelled' ? 'done' : 'error', ended: Date.now(), msg: sampleErrorText(e) }); }
function offerNewCard(acct) {
  toast(`Card or account ··${acct.last4} isn't saved yet`, '', { label: 'Add it', fn: () => pmModal(null, { last4: acct.last4, issuer: acct.institution || '', type: acct.kind || 'credit', name: `${acct.institution || 'Card'} ··${acct.last4}` }) });
}
function handleExtraction(job, out, meta) {
  const rows = (out && Array.isArray(out.transactions) ? out.transactions : Array.isArray(out) ? out : []);
  const acct = (out && out.account) || {};
  const last4 = String(acct.last4 || '').replace(/\D/g, '').slice(-4);
  const pm = pmByLast4(last4);
  if (last4.length === 4 && !pm) job.newCard = { last4, institution: acct.institution, kind: acct.kind };
  const mapped = rows.map((r) => ({
    date: String(r.date || ''), desc: r.description || r.desc || '', amount: Math.abs(Number(r.amount) || 0),
    type: r.transfer ? 'transfer' : r.direction === 'in' ? 'income' : 'expense',
    category: r.category, business: r.business, writeoff: r.writeoff, pct: r.businessPct, firm: r.firm,
    conf: Number.isFinite(Number(r.confidence)) ? Number(r.confidence) : null,
  })).filter((r) => r.amount > 0 && r.date <= addDays(todayStr(), 1));
  return addToInbox(mapped, { ...meta, pm: pm ? pm.id : '', last4 });
}

async function importImages(files, kind) {
  if (!aiReady() || !imgReady()) { toast('Reading images needs this page open on claude.ai', 'err'); return; }
  const max = Math.max(1, Math.min(Cloud.caps.limits.images.maxCount || 5, 10));
  for (let i = 0; i < files.length; i += max) {
    const group = files.slice(i, i + max);
    const job = newJob(group.length === 1 ? group[0].name || 'Image' : `${group.length} images`, kind);
    try {
      jobUpdate(job, { msg: 'Claude is reading…' });
      const out = await askClaudeJSON(extractPrompt(kind), { images: group, signal: job.ctl.signal });
      const res = handleExtraction(job, out, { source: kind === 'receipt' ? 'receipt' : 'screenshot', file: group.map((f) => f.name).join(', ').slice(0, 80) });
      finishJob(job, res);
    } catch (e) { failJob(job, e); }
  }
}
/* ---------- PDF statements ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
}
async function pdfLib() {
  if (!window.pdfjsLib) {
    await loadScript(PDFJS + 'pdf.min.js');
    await loadScript(PDFJS + 'pdf.worker.min.js'); // runs the parser in-page, no web worker needed
  }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function pdfPagesText(pdf) {
  const pages = [];
  for (let p = 1; p <= Math.min(pdf.numPages, 40); p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5] / 3) * 3;
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push({ x: it.transform[4], s: it.str });
    }
    const lines = [...rows.entries()].sort((a, b) => b[0] - a[0]).map(([, r]) => r.sort((a, b) => a.x - b.x).map((c) => c.s).join('  ').replace(/\s{3,}/g, '  '));
    pages.push(lines.join('\n'));
  }
  return pages;
}
async function pdfPageImages(pdf, max) {
  const out = [];
  for (let p = 1; p <= Math.min(pdf.numPages, max); p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1.6 });
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    out.push(await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85)));
  }
  return out;
}
async function importPDF(file) {
  const job = newJob(file.name, 'statement');
  try {
    if (!aiReady()) throw { code: 'unavailable' };
    jobUpdate(job, { msg: 'Opening the PDF…' });
    const lib = await pdfLib().catch(() => { throw { code: 'pdf', message: 'The PDF reader could not load. Screenshot the pages and drop the images instead.' }; });
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
    const pages = await pdfPagesText(pdf);
    const textLen = pages.join('').replace(/\s/g, '').length;
    let total = { added: 0, dups: 0, skipped: 0 };
    if (textLen < 200 * Math.min(pdf.numPages, 3)) {
      if (!imgReady()) throw { code: 'images_unavailable' };
      const max = Math.min(Cloud.caps.limits.images.maxCount || 5, 10);
      jobUpdate(job, { msg: `Scanned PDF, reading ${Math.min(pdf.numPages, max)} page images…` });
      const imgs = await pdfPageImages(pdf, max);
      const out = await askClaudeJSON(extractPrompt('statement'), { images: imgs, signal: job.ctl.signal });
      total = handleExtraction(job, out, { source: 'statement', file: file.name });
    } else {
      const chunks = []; let cur = '';
      for (const [i, t] of pages.entries()) {
        const block = `--- page ${i + 1} ---\n${t}\n`;
        if (cur && (cur + block).length > 38000) { chunks.push(cur); cur = ''; }
        cur += block.slice(0, 38000);
      }
      if (cur) chunks.push(cur);
      for (const [i, ch] of chunks.entries()) {
        jobUpdate(job, { msg: chunks.length > 1 ? `Claude is reading part ${i + 1} of ${chunks.length}…` : `Claude is reading ${plural(pages.length, 'page')}…` });
        const out = await askClaudeJSON(extractPrompt('statement', maskDigits(ch)), { signal: job.ctl.signal });
        const r = handleExtraction(job, out, { source: 'statement', file: file.name });
        total = { added: total.added + r.added, dups: total.dups + r.dups, skipped: total.skipped + r.skipped };
      }
    }
    finishJob(job, total);
  } catch (e) { failJob(job, e); }
}

/* ---------- OFX / QFX ---------- */
function parseOFX(text) {
  const tag = (s, t) => { const m = s.match(new RegExp(`<${t}>([^<\\r\\n]*)`, 'i')); return m ? m[1].trim() : ''; };
  const last4 = tag(text, 'ACCTID').replace(/\D/g, '').slice(-4);
  const org = tag(text, 'ORG');
  const isCard = /<CCSTMTRS>/i.test(text);
  const rows = [];
  for (const b of text.split(/<STMTTRN>/i).slice(1)) {
    const d = tag(b, 'DTPOSTED').slice(0, 8);
    const date = d.length === 8 ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}` : '';
    const amt = parseFloat(tag(b, 'TRNAMT'));
    if (!validDate(date) || !Number.isFinite(amt) || !amt) continue;
    const name = tag(b, 'NAME'), memo = tag(b, 'MEMO'), ttype = tag(b, 'TRNTYPE').toUpperCase();
    const desc = name || memo;
    const isTransfer = ['XFER', 'PAYMENT'].includes(ttype) && amt > 0 && isCard || /payment\s*(thank|received)|autopay|online transfer|transfer (to|from)/i.test(desc);
    rows.push({ date, desc, amount: Math.abs(amt), type: isTransfer ? 'transfer' : amt < 0 ? 'expense' : 'income', fitid: tag(b, 'FITID').slice(0, 60), notes: memo && memo !== name ? cleanDesc(memo) : '' });
  }
  return { rows, last4, org, isCard };
}
async function importOFX(file) {
  const job = newJob(file.name, 'ofx');
  try {
    const { rows, last4, org, isCard } = parseOFX(await readFileText(file));
    if (!rows.length) throw { message: 'No transactions found in that file.' };
    const pm = pmByLast4(last4);
    if (last4.length === 4 && !pm) job.newCard = { last4, institution: org, kind: isCard ? 'credit' : 'bank' };
    const res = addToInbox(rows, { source: 'ofx', file: file.name, pm: pm ? pm.id : '', last4 });
    finishJob(job, res);
    if (res.added && aiReady()) toast('Tip: “Auto-categorize” lets Claude sort the new items', '', { label: 'Run it', fn: () => ACT['inbox-ai']() });
  } catch (e) { failJob(job, e); }
}

/* ---------- entry points ---------- */
async function handleFiles(files, mode = 'auto') {
  files = [...files];
  if (!files.length) return;
  if (ui.view !== 'import') go('import');
  const ext = (f) => (f.name.split('.').pop() || '').toLowerCase();
  const imgs = files.filter((f) => /^image\//.test(f.type) || ['png', 'jpg', 'jpeg', 'webp', 'gif', 'heic'].includes(ext(f)));
  const other = files.filter((f) => !imgs.includes(f));
  for (const f of other) {
    const e = ext(f);
    if (f.size > 25 * 1024 * 1024) { toast(`${f.name} is larger than 25 MB`, 'err'); continue; }
    if (e === 'pdf' || f.type === 'application/pdf') await importPDF(f);
    else if (e === 'ofx' || e === 'qfx' || e === 'qbo') await importOFX(f);
    else if (e === 'csv' || f.type === 'text/csv') {
      const rows = parseCSV(await readFileText(f));
      if (rows.length < 2) toast(`No rows found in ${f.name}`, 'err'); else csvImportModal(rows, f.name);
    } else if (e === 'lvault' || e === 'json') await restoreFromFile(f);
    else toast(`${f.name}: use PDF, images, CSV or OFX/QFX`, 'err');
  }
  if (imgs.length) await importImages(imgs.filter((f) => !/heic/i.test(ext(f))), mode === 'receipt' ? 'receipt' : 'screenshot');
  if (imgs.some((f) => /heic/i.test(ext(f)))) toast('HEIC photos are not supported. Set your camera to “Most compatible” or screenshot instead.', 'err');
}
ACT['imp-pick'] = async () => { const f = await pickFile('image/*,.pdf,.csv,.ofx,.qfx,.qbo,.json,.lvault', true); if (f) handleFiles(f); };
ACT['imp-receipt'] = async () => { const f = await pickFile('image/*', false, 'environment'); if (f) handleFiles([f], 'receipt'); };
ACT['imp-paste'] = () => {
  if (!aiReady()) { toast('Reading text needs this page open on claude.ai', 'err'); return; }

const PFC_TRANSFER_PREFIXES = ['TRANSFER_IN_', 'TRANSFER_OUT_', 'LOAN_DISBURSEMENTS_'];
function categorizeFromPFC(pfc) {
  const detailed = pfc && pfc.detailed;
  if (!detailed) return {};
  if (PFC_MAP[detailed] === TRANSFER || PFC_TRANSFER_PREFIXES.some((p) => detailed.startsWith(p))) return { type: 'transfer' };
  const cat = PFC_MAP[detailed];
  if (cat === WORK_INCOME) return { category: S.settings.incomeDefault || 'Trading payouts' };
  return cat ? { category: cat } : {};
}

ACT['find-dupes'] = () => {
  // Reuse Ledger's own duplicate detection rather than re-implementing it:
  // addToInbox() already runs every imported item through findDuplicate()
  // (fuzzy date + description match against approved transactions) and
  // marks matches with it.dup/it.skip. This gathers those into one place
  // for a quick bulk review, plus a defensive exact-match sweep across the
  // inbox itself in case anything entered outside the normal import path.
  const flagged = new Map(); // inbox item id -> approved tx it matches
  for (const it of S.inbox) {
    if (it.dup) { const t = byId(S.transactions, it.dup); if (t) flagged.set(it.id, t); }
  }
  const exactGroups = new Map();
  for (const it of S.inbox) {
    const r = resolveItem(it);
    const key = `${r.date}|${r.cents}|${nameKey(r.desc)}`;
    if (!exactGroups.has(key)) exactGroups.set(key, []);
    exactGroups.get(key).push(it);
  }
  for (const group of exactGroups.values()) {
    if (group.length < 2) continue;
    for (const it of group.slice(1)) if (!flagged.has(it.id)) flagged.set(it.id, null); // null = duplicates another inbox item, not an approved tx
  }

  if (!flagged.size) { toast('No duplicates found.'); return; }

  const rows = [...flagged.entries()].map(([id, approvedTx]) => {
    const it = S.inbox.find((x) => x.id === id);
    const r = resolveItem(it);
    const amt = r.type === 'expense' ? -r.cents / 100 : r.cents / 100;
    const why = approvedTx ? `Matches approved: ${esc(approvedTx.desc)}` : 'Duplicate of another inbox item';
    return `<tr><td><input type="checkbox" name="d_${id}" checked></td><td class="nowrap">${fmtDate(r.date, { year: true })}</td><td>${esc(r.desc)}</td><td class="num ${amt > 0 ? 'pos' : ''}">${esc(money(amt))}</td><td class="muted small">${why}</td></tr>`;
  }).join('');

  const body = `<p class="text-2 small" style="margin-bottom:14px">${plural(flagged.size, 'inbox item')} look like duplicates. All are checked by default — uncheck anything you want to keep.</p>
    <div class="table-wrap"><table class="table"><thead><tr><th></th><th>Date</th><th>Description</th><th class="num">Amount</th><th>Why</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  openModal({
    title: 'Duplicate transactions', size: 'wide', submitText: `Discard selected`,
    body,
    onSubmit(fd) {
      const toRemove = [...flagged.keys()].filter((id) => fd.get(`d_${id}`));
      if (!toRemove.length) { toast('Nothing selected.', 'err'); return false; }
      const idSet = new Set(toRemove);
      commit(() => { S.inbox = S.inbox.filter((it) => !idSet.has(it.id)); }, `Discarded ${plural(toRemove.length, 'duplicate')}`);
    },
  });
};

// Adds bank-synced rows straight into approved transactions (no inbox
// review step) — trusted structured data from Plaid, unlike CSV/OFX/AI
// extraction which still go through the inbox. Dedupes by fitid (Plaid's
// own transaction id) plus the same fuzzy date+amount+description check
// (findDuplicate) the rest of the app already uses, so re-running this
// never double-books something already in the ledger.
// Adds bank-synced rows straight into approved transactions (no inbox
// review step) — trusted structured data from Plaid, unlike CSV/OFX/AI
// extraction which still go through the inbox. Dedupes by fitid (Plaid's
// own transaction id) plus the same fuzzy date+amount+description check
// (findDuplicate) the rest of the app already uses, so re-running this
// never double-books something already in the ledger.
// `accounts` (from /api/accounts) is used to fill in Paid with — matched
// to an existing card by last-4 the same way the rest of the app already
// matches cards (pmByLast4), auto-adding a card if none matches yet.
function addBankTransactionsDirect(rows, accounts) {
  const acctToPm = {};
  const newPMs = [];
  for (const a of accounts || []) {
    if (!a.mask) continue;
    let pm = pmByLast4(a.mask) || newPMs.find((p) => p.last4 === a.mask);
    if (!pm) {
      const type = a.type === 'credit' ? 'credit' : a.type === 'depository' ? 'debit' : 'other';
      pm = {
        id: uid(), name: `${a.institution_name || 'Bank'} ${a.name || ''}`.trim().slice(0, 40) || 'Card',
        type, issuer: a.institution_name || '', last4: a.mask,
        color: (S.paymentMethods.length + newPMs.length) % 8, dueDay: '', archived: false,
      };
      newPMs.push(pm);
    }
    acctToPm[a.account_id] = pm.id;
  }

  const existingFitids = new Set(S.transactions.filter((t) => t.fitid).map((t) => t.fitid));
  const toAdd = [];
  let dupes = 0, skipped = 0;
  for (const r of rows) {
    if (!validDate(r.date) || !(r.amount > 0)) { skipped++; continue; }
    if (r.fitid && existingFitids.has(r.fitid)) { dupes++; continue; }
    const cents = Math.round(r.amount * 100);
    const batchDup = toAdd.some((x) => x.amount === cents && Math.abs(daysBetween(x.date, r.date)) <= 3 && (x.date === r.date || similarDesc(x.desc, r.desc)));
    if (batchDup || findDuplicate(r.date, cents, r.desc)) { dupes++; continue; }

    const isTransfer = r.type === 'transfer' && !detectPropFirmName(r.desc);
    const type = isTransfer ? 'transfer' : (r.direction === 'in' ? 'income' : 'expense');
    const desc = cleanDesc(r.desc);
    let cat = '', biz = null;
    if (!isTransfer) {
      const rule = matchRule(desc);
      if (rule) {
        const rc = catOf(rule.cat);
        if (rc && rc.kind === type) cat = rule.cat;
        if (rule.biz) biz = { ...rule.biz };
      }
      // A rule can set a business without naming a firm. Attach the firm on
      // top of it rather than treating the row as already handled — every
      // prop firm charge is business activity.
      const pfTmp = { type, desc, biz };
      if (ensurePropFirmBiz(pfTmp)) {
        biz = pfTmp.biz;
        if (!cat) { const wantName = type === 'income' ? 'Trading payouts' : 'Prop firm'; const c = byName(catsOfKind(type), wantName); if (c) cat = c.id; }
      }
      if (!cat && r.category) { const c = byName(catsOfKind(type), r.category); if (c) cat = c.id; }
      if (!cat) cat = fallbackCat(type);
    }
    toAdd.push({
      id: uid(), created: Date.now() + toAdd.length, date: r.date, type, amount: cents,
      desc, cat, pm: acctToPm[r.accountId] || '', notes: '', tags: ['bank sync'], biz,
      ...(r.fitid ? { fitid: r.fitid } : {}),
    });
  }
  if (toAdd.length || newPMs.length) {
    commit(() => {
      if (newPMs.length) S.paymentMethods.push(...newPMs);
      if (toAdd.length) S.transactions.push(...toAdd);
    });
  }
  return { added: toAdd.length, dupes, skipped, newCards: newPMs.length };
}

    if (sync.status === 401) { window.location.href = '/login.html'; return; }
    if (!sync.ok) throw new Error(`Bank Sync returned ${sync.status}`);

    const [txRes, acctRes] = await Promise.all([fetch('/api/transactions'), fetch('/api/accounts')]);
    if (!txRes.ok) throw new Error(`Bank Sync returned ${txRes.status}`);
    const list = await txRes.json();
    const accounts = acctRes.ok ? await acctRes.json() : [];
    const rows = list
      .filter((t) => !t.pending)
      .map((t) => ({
        date: t.date,
        desc: t.merchant_name || t.name || 'Bank transaction',
        amount: Math.abs(t.amount),
        direction: t.amount > 0 ? 'out' : 'in', // Plaid: positive = money out
        fitid: 'plaid-' + t.transaction_id,
        accountId: t.account_id,
        ...categorizeFromPFC(t.personal_finance_category),
      }));
    if (!rows.length) {
      jobUpdate(job, { status: 'done', ended: Date.now(), msg: 'No connected-bank transactions found yet' });
      toast('No transactions yet — connect a bank in Bank Sync first.');
      return;
    }
    const out = addBankTransactionsDirect(rows, accounts);
    const parts = [`${plural(out.added, 'transaction')} added`];
    if (out.dupes) parts.push(`${out.dupes} already up to date`);
    if (out.newCards) parts.push(`${plural(out.newCards, 'card')} added`);
    jobUpdate(job, { status: 'done', ended: Date.now(), msg: parts.join(' · ') });
    toast(out.added ? `${plural(out.added, 'new transaction')} added to your books` : 'Already up to date — nothing new.');
  } catch (e) {
    console.error(e);
    failJob(job, e);
    toast('Could not reach Bank Sync — is it running?', 'err');
  }
};

  if (S.settings.learnRules === false || !it.edited || r.type === 'transfer' || !r.desc) return;

  const i = S.rules.findIndex((x) => norm(x.match) === match);

/* ---------- Ask about your money ---------- */
function moneyContext() {
  const y = curMonth().slice(0, 4);
  const months = Array.from({ length: 12 }, (_, i) => addMonths(curMonth(), i - 11));
  const lines = [];
  lines.push(`Today: ${todayStr()}. Currency: ${S.settings.currency}.`);
  lines.push('Monthly totals (income / spending): ' + months.map((m) => { const t = monthTotals(m); return `${m}: ${Math.round(t.income / 100)} / ${Math.round(t.expense / 100)}`; }).join('; '));
  const byCat = new Map(), merch = new Map();
  for (const t of S.transactions) {
    if (t.type !== 'expense' || !t.date.startsWith(y)) continue;
    const c = (catOf(t.cat) || { name: 'Uncategorized' }).name;
    byCat.set(c, (byCat.get(c) || 0) + t.amount);
    const k = t.desc.slice(0, 40); merch.set(k, (merch.get(k) || 0) + t.amount);
  }
  lines.push(`${y} spending by category: ` + [...byCat].sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${Math.round(v / 100)}`).join('; '));
  lines.push(`${y} top merchants: ` + [...merch].sort((a, b) => b[1] - a[1]).slice(0, 30).map(([k, v]) => `${k} ${Math.round(v / 100)}`).join('; '));
  for (const b of S.businesses) {
    const tx = S.transactions.filter((t) => t.biz && t.biz.b === b.id && t.date.startsWith(y));
    const bc = new Map();
    for (const t of tx.filter((x) => x.type === 'expense')) { const n = (bizCatOf(t.biz.c) || { name: 'Other' }).name; bc.set(n, (bc.get(n) || 0) + deductible(t)); }
    lines.push(`Business "${b.name}" ${y}: income ${Math.round(sum(tx.filter((t) => t.type === 'income'), (t) => t.amount) / 100)}, deductible ${Math.round(sum(tx, deductible) / 100)} (${[...bc].map(([k, v]) => `${k} ${Math.round(v / 100)}`).join('; ')})`);
  }
  const firms = propFirmStats('all');
  if (firms.length) lines.push('Prop Firms (all time, paid / payouts): ' + firms.map((f) => `${f.name} ${Math.round(f.spent / 100)} / ${Math.round(f.payouts / 100)} (${f.evals} evals)`).join('; '));
  const nw = netWorth();
  lines.push(`Net Worth ${Math.round(nw.total / 100)} (assets ${Math.round(nw.assets / 100)}, investments ${Math.round(nw.investments / 100)}, debts ${Math.round(nw.liabilities / 100)}).`);
  lines.push('Budgets: ' + catsOfKind('expense').filter((c) => c.budget).map((c) => `${c.name} ${Math.round(c.budget / 100)}/mo (this month ${Math.round((spendByCat(curMonth()).get(c.id) || 0) / 100)})`).join('; '));
  lines.push('Recurring: ' + S.recurring.filter((r) => r.active !== false).map((r) => `${r.name} ${Math.round(r.amount / 100)} ${r.freq}`).join('; '));
  lines.push('Goals: ' + S.goals.map((g) => `${g.name} ${Math.round(g.saved / 100)} of ${Math.round(g.target / 100)}`).join('; '));
  return lines.join('\n').slice(0, 30000);
}

  const txs = S.transactions.filter((t) => t.biz && t.date.startsWith(y) && inBizTab(t.biz.b));

  const income = sum(txs.filter((t) => t.type === 'income'), (t) => t.amount);

  const mileDed = sum(trips, tripDeduction);

  const net = income - ded - mileDed;
  return { txs, exp, trips, income, ded, gross, mileDed, miles, net, setAside: Math.max(0, Math.round(net * (S.settings.taxPct || 0) / 100)) };
}

function monthsUntil(date) {
  if (!date) return null;
  const a = parseD(todayStr()), b = parseD(date);
  return Math.max(0, (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() >= a.getDate() ? 0 : -1));
}
VIEWS.goals = {

      const r = g.target ? clamp(g.saved / g.target, 0, 1) : 0;

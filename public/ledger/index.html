      const perMonth = left > 0 && m != null ? Math.ceil(left / Math.max(1, m)) : 0;
      return `<section class="card goal click" data-act="goal-open" data-id="${g.id}">
        ${safeUrl(g.image) ? `<div class="goal-cover"><img src="${esc(safeUrl(g.image))}" alt="" referrerpolicy="no-referrer" onerror="this.closest('.goal-cover').remove()"></div>` : ''}
        <div class="goal-top"><div><div class="row" style="gap:8px"><i class="dot" style="--dot:${colorVar(g.color)}"></i><h3 style="font-size:15px">${esc(g.name)}</h3></div><div class="goal-amt amt" style="margin-top:8px">${esc(money(g.saved, { whole: true }))} <small>of ${esc(money(g.target, { whole: true }))}</small></div></div>
        <button class="btn ghost icon-btn sm" data-act="goal-edit" data-id="${g.id}" aria-label="Edit goal">${icon('edit')}</button></div>
        <div class="progress"><i style="width:${r * 100}%;--bar:${colorVar(g.color)}"></i></div>
        <div class="goal-facts"><span><b>${pct(r)}</b> saved</span><span>${left ? `<b class="amt">${esc(money(left, { whole: true }))}</b> to go` : `<b class="pos">${icon('check')} Reached</b>`}</span></div>
        <div class="goal-facts"><span>${g.deadline ? `By ${esc(fmtDate(g.deadline, { year: true }))}` : 'No deadline'}</span><span>${perMonth ? `<b class="amt">${esc(money(perMonth, { whole: true }))}</b>/mo needed` : ''}</span></div>
        <div class="row"><button class="btn sm" data-act="goal-add-money" data-id="${g.id}">${icon('plus')}Add money</button><button class="btn sm ghost" data-act="goal-add-money" data-id="${g.id}" data-neg="1">Withdraw</button></div>
      </section>`;
    }).join('');
    return `<div class="toolbar"><span class="spacer"></span>${templates}</div><div class="goal-grid">${cards}</div>`;
  },
};
// A goal can be a thing rather than a number — a car, a rig, a watch — and a
// thing has a listing: a picture, a price, a page to buy it from. Only http(s)
// is allowed through: these are URLs the person pasted, and a javascript: href
// in a link they click is the one way that hurts them.
function safeUrl(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  try {
    const parsed = new URL(s, location.href);
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
  } catch (e) { return ''; }
}
function goalHost(u) {
  const safe = safeUrl(u);
  if (!safe) return '';
  try { return new URL(safe).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
}

// What a goal is worth knowing at a glance: how far along, what is left, and
// when it lands at the current rate.
function goalFacts(g) {
  const ratio = g.target ? clamp(g.saved / g.target, 0, 1) : 0;
  const left = Math.max(0, g.target - g.saved);
  const months = monthsUntil(g.deadline);
  const perMonth = left > 0 && months != null ? Math.ceil(left / Math.max(1, months)) : 0;
  return { ratio, left, months, perMonth, done: left === 0 && g.target > 0 };
}

// Goals on the Dashboard: the reason the rest of the page matters.
function goalsCardHTML(cls = 's6') {

/* ---------- Theme ----------
   Device-level, like the privacy toggle, rather than part of the synced
   document: the same books opened on a phone and a laptop can reasonably
   want different themes. "system" means no data-theme attribute at all, so
   the prefers-color-scheme rules take over again. The head script applies
   the saved value before first paint; this only handles later changes. */
function applyTheme(v) {
  ui.theme = v;
  Prefs.set('theme', v);
  if (v === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
}
const THEME_LABEL = { system: 'Following your system', light: 'Light', blue: 'Light blue', dark: 'Dark' };
/* ---------- Bringing new defaults into an existing account ----------
   Settings merge on load, so a newly added setting reaches every account on
   its own. Lists do not: categories, write-off categories and businesses are
   yours to edit, so the app will not quietly rewrite them — which also means
   a category added to the defaults after you signed up never appears.

   This closes that gap by adding what is missing and touching nothing else.
   Matching is by name, so a category you renamed is treated as yours and is
   not duplicated back in. Nothing is renamed, reordered or removed. */
function missingDefaults() {
  const base = defaultState();
  const have = (list) => new Set(list.map((x) => norm(x.name)));
  const haveCats = have(S.categories);
  const haveBcs = have(S.bizCats);
  const haveBiz = have(S.businesses);
  return {
    categories: base.categories.filter((c) => !haveCats.has(norm(c.name))),
    bizCats: base.bizCats.filter((c) => !haveBcs.has(norm(c.name))),
    businesses: base.businesses.filter((b) => !haveBiz.has(norm(b.name))),
  };
}
ACT['sync-defaults'] = async () => {
  const miss = missingDefaults();
  const n = miss.categories.length + miss.bizCats.length;
  if (!n) { toast('Nothing new — your lists already have everything.'); return; }
  const names = miss.categories.concat(miss.bizCats).map((c) => c.name).join(', ');
  const okGo = await confirmDialog({
    title: `Add ${plural(n, 'missing item')}?`,
    message: `<b>${esc(names)}</b><br><br>These exist for new accounts but not yours. Nothing is renamed, reordered or removed — they are only added.`,
    confirmText: 'Add them',
    danger: false,
  });
  if (!okGo) return;
  // Businesses are deliberately excluded: adding one back to somebody who
  // deleted it is the opposite of helpful.
  commit(() => {
    S.categories.push(...miss.categories.map((c) => ({ ...c, id: uid() })));
    S.bizCats.push(...miss.bizCats.map((c) => ({ ...c, id: uid() })));
  }, `${plural(n, 'item')} added`);
};

/* ---------- Motion ----------
   Reduced motion is an accessibility setting and is honoured by default. It is
   also off by default on plenty of Windows machines, which silently produces a
   dead interface with nothing explaining why — so the choice is surfaced and
   can be overruled in either direction. */
function applyMotion(v) {
  ui.motion = v;
  Prefs.set('motion', v);
  if (v === 'system') document.documentElement.removeAttribute('data-motion');
  else document.documentElement.setAttribute('data-motion', v);
}
const systemWantsLessMotion = () => {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
};
function motionStatusText() {
  if (ui.motion === 'off') return 'Animation is off because you turned it off here.';
  if (ui.motion === 'full') return systemWantsLessMotion()
    ? 'Animation is on because you asked for it here, overriding your system setting.'
    : 'Animation is on.';
  return systemWantsLessMotion()
    ? 'Following your system, which asks for reduced motion — animation is off. Choose Full to override it.'
    : 'Following your system, which currently allows animation.';
}

function pickFile(accept, multiple = false, capture = '') {
  return new Promise((res) => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept; inp.multiple = multiple; inp.style.display = 'none';
    if (capture) inp.setAttribute('capture', capture);
    inp.addEventListener('change', () => { res(inp.files && inp.files.length ? (multiple ? [...inp.files] : inp.files[0]) : null); inp.remove(); });
    document.body.appendChild(inp); inp.click();
  });
}
async function restoreFromFile(f) {
  if (!f) return;
  if (f.size > 50 * 1024 * 1024) { toast('That file is too large to be a backup', 'err'); return; }
  let blob;
  try { blob = JSON.parse(await readFileText(f)); } catch (e) { toast('That file is not a Ledger Vault backup', 'err'); return; }
  let data;
  if (blob && blob.app === 'ledger-vault-cloud' && blob.data) data = blob.data;
  else if (V1.isBlob(blob)) {
    const pw = await promptPassword({ title: 'Unlock your v1 backup', message: 'Enter the master password you used in Ledger Vault v1. It is only used here, in this page, to decrypt the file.', submitText: 'Decrypt' });
    if (!pw) return;
    try { data = await V1.open(pw, blob); } catch (e) { toast('Wrong password for this backup', 'err'); return; }
  } else { toast('That file is not a Ledger Vault backup', 'err'); return; }
  const d = normalizeState(data);
  const ok = await confirmDialog({ title: 'Replace your current data?', message: `The backup has <b>${plural(d.transactions.length, 'transaction')}</b>, ${plural(d.paymentMethods.length, 'card')} and ${plural(d.holdings.length, 'holding')}. Everything currently in Ledger Vault Cloud (except your inbox) is replaced.`, confirmText: 'Replace', requireText: 'RESTORE' });
  if (!ok) return;
  const inbox = S.inbox;
  commit(() => { S = d; S.inbox = inbox; }, `Restored ${plural(d.transactions.length, 'transaction')}`);
}

ACT['csv-import'] = async () => {
  const f = await pickFile('.csv,text/csv');
  if (!f) return;

  let rows;
  try { rows = parseCSV(await readFileText(f)); } catch (e) { toast('Could not read that file', 'err'); return; }
  if (rows.length < 2) { toast('No rows found in that CSV', 'err'); return; }
  csvImportModal(rows, f.name);
};
function csvImportModal(rows, fileName) {
  const header = rows[0].map((h) => String(h).trim());
  const data = rows.slice(1);
  const find = (re) => { const i = header.findIndex((h) => re.test(h)); return i >= 0 ? String(i) : ''; };
  const guess = {
    date: find(/date|posted/i) || '0',
    desc: find(/desc|memo|payee|merchant|name|details|narrative/i) || '1',
    amount: find(/^amount$|amount|value/i),
    debit: find(/debit|withdraw|charge/i),
    credit: find(/credit|deposit|payment/i),
  };
  const mode0 = guess.amount ? 'single' : guess.debit && guess.credit ? 'split' : 'single';
  const colOpts = (sel, allowNone) => (allowNone ? '<option value="">—</option>' : '') + header.map((h, i) => `<option value="${i}" ${String(i) === sel ? 'selected' : ''}>${esc(h || `Column ${i + 1}`)}</option>`).join('');
  const body = `<p class="text-2 small" style="margin-bottom:14px"><b>${esc(fileName)}</b> · ${plural(data.length, 'row')}. Match the columns, check the preview, import. Nothing leaves your device.</p>
    <div class="form-grid">
      ${UI.field('Date column', `<select class="select" name="cDate">${colOpts(guess.date)}</select>`)}
      ${UI.field('Description column', `<select class="select" name="cDesc">${colOpts(guess.desc)}</select>`)}
      ${UI.field('Amounts are in', `<select class="select" name="mode"><option value="single" ${mode0 === 'single' ? 'selected' : ''}>One column</option><option value="split" ${mode0 === 'split' ? 'selected' : ''}>Separate debit & credit columns</option></select>`)}
      <div class="f-single">${UI.field('Amount column', `<select class="select" name="cAmt">${colOpts(guess.amount || '2')}</select>`)}</div>
      <div class="f-single">${UI.field('Spending shows as', '<select class="select" name="sign"><option value="neg">Negative numbers (most banks)</option><option value="pos">Positive numbers (many credit cards)</option></select>')}</div>
      <div class="f-split">${UI.field('Debit (money out)', `<select class="select" name="cDebit">${colOpts(guess.debit, true)}</select>`)}</div>
      <div class="f-split">${UI.field('Credit (money in)', `<select class="select" name="cCredit">${colOpts(guess.credit, true)}</select>`)}</div>
      ${UI.field('Paid with', `<select class="select" name="pm">${pmOptions('')}</select>`)}
      <label class="check full"><input type="checkbox" name="dedupe" checked> Skip rows that look like duplicates (same date, amount and description)</label>
      <label class="check full"><input type="checkbox" name="skipIncome"> Treat money-in rows as transfers (e.g. credit card payments)</label>
    </div>
    <div class="divider"></div>
    <div data-preview></div>`;
  let parsed = [];
  openModal({
    title: 'Import bank CSV', size: 'wide', body, submitText: 'Send to inbox',
    onOpen(form) {
      const upd = () => {
        const g = (n) => form.elements[n].value;
        const split = g('mode') === 'split';
        $$('.f-single', form).forEach((e) => { e.hidden = split; });
        $$('.f-split', form).forEach((e) => { e.hidden = !split; });
        const pm = g('pm');
        const existing = new Set(S.transactions.map((t) => `${t.date}|${t.amount}|${norm(t.desc)}`));
        const seen = new Set();
        let bad = 0, dup = 0;
        parsed = [];
        for (const r of data) {
          const date = parseLooseDate(r[Number(g('cDate'))]);
          const desc = String(r[Number(g('cDesc'))] || '').trim().replace(/\s+/g, ' ').slice(0, 120);
          let cents;
          if (split) {
            const d = g('cDebit') ? parseMoney(r[Number(g('cDebit'))]) : NaN;
            const c = g('cCredit') ? parseMoney(r[Number(g('cCredit'))]) : NaN;
            cents = !isNaN(d) && d !== 0 ? -Math.abs(d) : !isNaN(c) && c !== 0 ? Math.abs(c) : NaN;
          } else {
            cents = parseMoney(r[Number(g('cAmt'))]);
            if (!isNaN(cents) && g('sign') === 'pos') cents = -cents;
          }
          if (!date || isNaN(cents) || cents === 0) { bad++; continue; }
          let type = cents < 0 ? 'expense' : 'income';
          if (type === 'income' && form.elements.skipIncome.checked) type = 'transfer';
          const amount = Math.abs(cents);
          const key = `${date}|${amount}|${norm(desc)}`;
          if (form.elements.dedupe.checked && (existing.has(key) || seen.has(key))) { dup++; continue; }
          seen.add(key);
          const rule = matchRule(desc);
          const last = !rule ? lastTxLike(desc) : null;
          let cat = '', biz = null, rpm = pm;
          if (type !== 'transfer') {
            const src = rule || last;
            const sc = src && catOf(src.cat);
            if (sc && sc.kind === type) { cat = sc.id; biz = src.biz ? { b: src.biz.b, c: src.biz.c || '', pct: src.biz.pct ?? 100, firm: src.biz.firm || '', receipt: false, rnote: '' } : null; if (!rpm && src.pm) rpm = src.pm; }
            if (!cat) cat = fallbackCat(type);
          }
          parsed.push({ date, type, amount, desc: desc || 'Imported', cat, pm: rpm, biz, matched: !!(rule || last) });
        }
        const matched = parsed.filter((p) => p.matched).length;
        form.querySelector('[data-preview]').innerHTML = `<div class="summary-strip"><span><b>${parsed.length}</b> ready</span><span><b>${matched}</b> auto-categorized</span>${dup ? `<span><b>${dup}</b> duplicates skipped</span>` : ''}${bad ? `<span><b>${bad}</b> unreadable rows skipped</span>` : ''}</div>
          <div class="table-wrap" style="margin:0"><table class="table preview-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th></tr></thead><tbody>${parsed.slice(0, 8).map((p) => `<tr><td class="nowrap">${fmtDate(p.date, { year: true })}</td><td><div class="desc">${esc(p.desc)}</div></td><td>${p.type === 'transfer' ? '<span class="badge">Transfer</span>' : UI.cat(catOf(p.cat))}${p.biz ? ' ' + UI.bizBadge(p) : ''}</td><td class="num ${p.type === 'income' ? 'pos' : ''}">${esc(money(p.type === 'expense' ? -p.amount : p.amount))}</td></tr>`).join('')}</tbody></table></div>
          ${parsed.length > 8 ? `<p class="muted small" style="margin-top:8px">…and ${parsed.length - 8} more. Everything is tagged #imported so you can review it later.</p>` : ''}`;
        const btn = form.querySelector('[type=submit]'); if (btn) btn.textContent = `Send ${parsed.length} to inbox`;
      };
      form.addEventListener('change', upd);
      upd();
    },
    onSubmit() {
      if (!parsed.length) { toast('Nothing to import. Check the column mapping.', 'err'); return false; }
      const rows = parsed.map(({ matched, amount, ...t }) => ({ ...t, amount: amount / 100 }));
      const res = addToInbox(rows, { source: 'csv', file: fileName });
      toast(`${plural(res.added, 'transaction')} added to your inbox${res.dups ? ` · ${res.dups} possible duplicates` : ''}`);
      go('import');
    },
  });
}

/* =========================================================
   Boot: connect to the private cloud store, or fall back to demo mode.
   ========================================================= */
function loadingHTML() {
  return `<div class="boot"><div class="brand"><span class="brand-mark">${BRAND_SVG}</span><span>Ledger Vault<small>Cloud</small></span></div><p class="muted">Loading your private data…</p><div class="boot-bar"><i></i></div></div>`;
}
function mountApp() {
  document.body.classList.toggle('compact', ui.compact);
  applyMotion(ui.motion);
  $('#app').innerHTML = shellHTML();
  ui.view = parseHash();
  if (!location.hash) { try { history.replaceState(null, '', '#/dashboard'); } catch (e) { /* sandboxed */ } }
  lastActivity = Date.now();
  render();
  if (Cloud.mode === 'demo') toast('Demo mode: sample data, nothing is saved');
  else {
    const due = upcoming(0);
    if (S.inbox.length) toast(`${plural(S.inbox.length, 'item')} waiting in your inbox`, '', { label: 'Review', fn: () => go('import') });
    else if (due.length) toast(`${plural(due.length, 'bill')} due now`, '', { label: 'Review', fn: () => go('recurring') });
  }
}
async function boot() {
  $('#app').innerHTML = loadingHTML();
  const docs = await Cloud.init();
  if (Cloud.mode === 'cloud') {
    S = stateFromDocs(docs);
    if (!docs.has('config')) Cloud.save(S);
    Cloud.onRemote = applyRemote;
  } else {
    S = defaultState();
    loadSampleData();
  }
  mountApp();
}
boot();

})();</script>

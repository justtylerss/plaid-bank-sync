<title>Ledger Vault Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Onest:wght@500;600;700&display=swap">
<style>
/* ============ Tokens ============
   System adapted from the Revolut DESIGN.md reference (pill controls, 20px cards,
   depth from surface luminance instead of shadows, tight display numerals).
   Hues, type and identity are this app's own. */
:root {
  color-scheme: light;
  --bg: #f1f1ee; --surface: #ffffff; --surface-2: #f6f6f3; --surface-3: #e9e9e4;
  --card-border: #e5e5e0; --line: #e6e6e1; --line-2: #d3d3cc;
  --text: #15171a; --text-2: #4a5056; --muted: #7d8389;
  --accent: #0b6e4f; --accent-text: #0a6849; --accent-ink: #ffffff; --accent-soft: rgba(11,110,79,.10);
  --feature: #0b5c43; --feature-ink: #ffffff; --feature-mute: rgba(255,255,255,.74); --feature-line: rgba(255,255,255,.16);
  --btn: #15171a; --btn-ink: #ffffff;
  --pos: #0b7a45; --neg: #cf2f3b; --warn: #e07600; --crit: #e23b4a;
  --grid: #ebebe6; --axis: #c9c9c2;
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #eda100;
  --c4: #e87ba4; --c5: #008300; --c6: #4a3aa7; --c7: #e34948;
  --radius: 20px; --radius-sm: 12px;
  /* Spacing. One scale, so the gaps between things mean something instead of
     being whatever looked right that day. Space is the main tool for hierarchy
     here: room around a figure is what makes it read as important, and room
     between groups is what tells you where one idea ends. */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  /* Motion. Durations follow NN/g: ~100ms reads as instant and suits direct
     feedback, 200-300ms suits things entering or leaving, and past ~500ms
     animation starts to feel like waiting. Curves follow Material: ease-out
     for entrances so the eye can settle on the element as it arrives, ease-in
     for exits so it accelerates away, standard for moves between two states.
     Linear is avoided everywhere — it is the one curve that reads as wrong. */
  --dur-1: 120ms;   /* presses, toggles, hovers */
  --dur-2: 200ms;   /* small moves, tooltips */
  --dur-3: 280ms;   /* entrances, modals, view changes */
  --ease-out: cubic-bezier(0, 0, .2, 1);
  --ease-in: cubic-bezier(.4, 0, 1, 1);
  --ease: cubic-bezier(.4, 0, .2, 1);
  --shadow: 0 24px 60px rgba(16,18,20,.16);
  --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Onest", "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="blue"]) {
    color-scheme: dark;
    --bg: #08090a; --surface: #141618; --surface-2: #1b1e21; --surface-3: #25292d;
    --card-border: rgba(255,255,255,.05); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
    --text: #f4f4f1; --text-2: #b3b8bd; --muted: #7f858b;
    --accent: #2fbf8f; --accent-text: #45d6a3; --accent-ink: #03140d; --accent-soft: rgba(47,191,143,.14);
    --feature: #0e6348; --feature-ink: #ffffff; --feature-mute: rgba(255,255,255,.74); --feature-line: rgba(255,255,255,.16);
    --btn: #f4f4f1; --btn-ink: #08090a;
    --pos: #3ccf7f; --neg: #ff6b72; --warn: #fab219; --crit: #e5484d;
    --grid: #222528; --axis: #373b3f;
    --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500;
    --c4: #d55181; --c5: #008300; --c6: #9085e9; --c7: #e66767;
    --shadow: 0 24px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #08090a; --surface: #141618; --surface-2: #1b1e21; --surface-3: #25292d;
  --card-border: rgba(255,255,255,.05); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
  --text: #f4f4f1; --text-2: #b3b8bd; --muted: #7f858b;
  --accent: #2fbf8f; --accent-text: #45d6a3; --accent-ink: #03140d; --accent-soft: rgba(47,191,143,.14);
  --feature: #0e6348; --feature-ink: #ffffff; --feature-mute: rgba(255,255,255,.74); --feature-line: rgba(255,255,255,.16);
  --btn: #f4f4f1; --btn-ink: #08090a;
  --pos: #3ccf7f; --neg: #ff6b72; --warn: #fab219; --crit: #e5484d;
  --grid: #222528; --axis: #373b3f;
  --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500;
  --c4: #d55181; --c5: #008300; --c6: #9085e9; --c7: #e66767;
  --shadow: 0 24px 60px rgba(0,0,0,.6);
}

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent-text); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.mono { font-family: var(--mono); font-size: .92em; letter-spacing: .02em; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.privacy .amt { filter: blur(7px); user-select: none; }
.privacy #tip { display: none !important; }

.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 650; letter-spacing: -.015em; font-size: 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 30px; height: 30px; }
.brand small { display: block; font-family: var(--font); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 1px; }

/* ============ App shell ============ */
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column;
  padding: var(--sp-4) var(--sp-3) var(--sp-3); border-right: 1px solid var(--line); background: var(--bg); z-index: 30;
}
.sidebar .brand { padding: var(--sp-1) var(--sp-3) var(--sp-5); }
.nav-group { margin-bottom: var(--sp-5); }
.nav-label { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
  padding: 0 var(--sp-3) var(--sp-2); }
.nav a {
  display: flex; align-items: center; gap: var(--sp-3); min-height: 36px; padding: 0 var(--sp-3);
  border-radius: 999px; color: var(--text-2); text-decoration: none; font-weight: 500;
  font-size: 13.5px; position: relative; margin-bottom: 2px;
}
.nav a:hover { background: var(--surface-3); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav a.active svg { color: var(--accent); }
.nav a > span:not(.count) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav a .count { margin-left: auto; font-size: 11px; background: var(--accent-soft); color: var(--accent-text); border-radius: 20px; padding: 1px 7px; font-weight: 600; }
.side-foot { margin-top: auto; padding-top: var(--sp-3); border-top: 1px solid var(--line); display: grid; gap: var(--sp-2); }
.save-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 8px; }
.save-status .led { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pos) 20%, transparent); }
.save-status.saving .led { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
.save-status.error .led { background: var(--crit); }
.side-actions { display: flex; gap: 6px; }
.side-actions .btn { flex: 1; }

.main { min-width: 0; padding: 0 30px 80px; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 14px 0; margin-bottom: 22px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.topbar h1 { font-size: 24px; letter-spacing: -.025em; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn { display: none; }
.month-nav { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--card-border); border-radius: 999px; padding: 2px; }
.month-nav button { background: none; border: 0; padding: 6px 8px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; border-radius: 999px; }
.month-nav button:hover { color: var(--text); background: var(--surface-2); }
.month-nav .ml { white-space: nowrap; min-width: 128px; text-align: center; font-weight: 550; font-size: 13.5px; padding: 7px 4px; }
.seg { display: inline-flex; align-items: center; background: var(--surface-2); border: 1px solid var(--card-border); border-radius: 999px; padding: 2px; gap: 1px; }
.seg button { background: none; border: 0; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; border-radius: 999px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--card-border); }
.scrim { display: none; }

/* ============ Controls ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), transform 60ms var(--ease-out);
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--btn) 86%, var(--accent)); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.accent:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--neg); }
.btn.danger.solid { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.sm { height: 32px; padding: 0 13px; font-size: 12.5px; }
.btn.lg { height: 48px; padding: 0 26px; font-size: 15px; }
.btn.block { width: 100%; }
.icon-btn { width: 36px; height: 36px; padding: 0; }
.icon-btn.sm { width: 30px; height: 30px; padding: 0; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }
.btn.primary .kbd { color: var(--btn-ink); border-color: color-mix(in srgb, var(--btn-ink) 30%, transparent); }

.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted); }
.input, .select, textarea.input {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text); outline: none; transition: border-color .12s, box-shadow .12s;
}
textarea.input { height: auto; min-height: 64px; padding: 9px 11px; resize: vertical; }
.select { appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 16px, calc(100% - 11px) 16px; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.lg { height: 52px; font-size: 24px; font-family: var(--display); font-weight: 600; letter-spacing: -.02em; }
.input.invalid { border-color: var(--crit); }
.input-wrap { position: relative; }
.input-wrap .prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-weight: 600; }
.input-wrap .prefix + .input { padding-left: 26px; }
.input-wrap .suffix-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; }
.search .input { padding-left: 32px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 6px 16px; border-radius: 999px; font-weight: 550; font-size: 13px; color: var(--text-2); cursor: pointer; }
.seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--line-2), 0 0 0 1px var(--line-2); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 550; }
.switch input { appearance: none; -webkit-appearance: none; width: 36px; height: 21px; border-radius: 20px; background: var(--surface-3); border: 1px solid var(--line-2); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--text-2); transition: transform .15s, background .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(15px); background: var(--accent-ink); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-2); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.color-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.color-pick label { position: relative; }
.color-pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.color-pick span { display: block; width: 24px; height: 24px; border-radius: 7px; background: var(--dot); border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
.color-pick input:checked + span { border-color: var(--text); }
.color-pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ Layout pieces ============ */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 22px; min-width: 0; }
.card.feature { background: var(--feature); color: var(--feature-ink); border-color: transparent; }
.card.feature .muted, .card.feature .hero-label, .card.feature .hero-row div, .card.feature .card-sub { color: var(--feature-mute); }
.card.feature .hero-row b { color: var(--feature-ink); }
.card.feature .delta.good, .card.feature .delta.bad, .card.feature .delta.flat { color: var(--feature-ink); }
.card.feature .nw-goals { border-color: var(--feature-line); }
.card.feature .progress { background: var(--feature-line); }
.card.flush { padding: 0; }
.card.flush .card-h { padding: 18px 22px 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h3 { font-size: 16px; font-weight: 600; }
.card-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.stack { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 28px 0 12px; display: flex; align-items: center; gap: 8px; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar .search { flex: 1 1 220px; max-width: 340px; }
.toolbar .select { width: auto; min-width: 130px; height: 34px; }
.pill-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.pill-tabs button { border: 1px solid var(--line-2); background: transparent; color: var(--text-2); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-weight: 550; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.pill-tabs button:hover { color: var(--text); background: var(--surface-2); }
.pill-tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* ============ Stats ============ */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.stat-label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat-value { font-family: var(--display); font-size: 27px; font-weight: 600; letter-spacing: -.03em; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 550; margin-top: 4px; }
.delta.good { color: var(--pos); } .delta.bad { color: var(--neg); } .delta.flat { color: var(--muted); }
.delta svg { width: 12px; height: 12px; stroke-width: 2.4; }
.hero { display: flex; flex-direction: column; gap: 4px; }
.hero-label { font-size: 13px; color: var(--muted); }
.hero-value { font-family: var(--display); font-size: clamp(40px, 4.6vw, 60px); font-weight: 600; letter-spacing: -.045em; line-height: 1.02; }
.hero-row { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; }
.hero-row div { font-size: 12.5px; color: var(--muted); }
.hero-row b { display: block; color: var(--text); font-size: 15px; font-weight: 600; margin-top: 1px; }
.mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.mini-stats .ms-l { font-size: 12.5px; color: var(--muted); }
.mini-stats .ms-v { font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -.02em; }

/* ============ Tables & lists ============ */
.table-wrap { overflow-x: auto; margin: 0 -22px; }
.card.flush .table-wrap { margin: 0; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table th:first-child, .table td:first-child { padding-left: 22px; }
.table th:last-child, .table td:last-child { padding-right: 22px; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr:hover { background: var(--surface-2); }
.table .num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tfoot td { font-weight: 600; border-top: 1px solid var(--line-2); border-bottom: 0; }
.table .actions { text-align: right; white-space: nowrap; width: 1%; }
.table .desc { font-weight: 550; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table .sub { font-size: 12px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
.row-actions { display: inline-flex; gap: 2px; opacity: .55; }
tr:hover .row-actions, .row-actions:focus-within { opacity: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); display: inline-block; flex: none; }
.cat { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.badge.biz { background: var(--accent-soft); color: var(--accent-text); }
.badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--text); }
.badge.crit { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--text); }
.badge.good { background: color-mix(in srgb, var(--pos) 16%, transparent); color: var(--text); }
.badge svg { width: 12px; height: 12px; stroke-width: 2.2; }
.list { display: grid; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list-item:last-child { border-bottom: 0; }
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .li-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .li-sub.wrap { white-space: normal; }
.nw-goals { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.nw-goals .row { justify-content: space-between; font-size: 12.5px; }
.nw-goals .progress { height: 6px; margin-top: 4px; }
.list-item .li-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ico-tile { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; background: color-mix(in srgb, var(--dot, var(--muted)) 18%, transparent); color: var(--text); flex: none; }
.ico-tile svg { width: 16px; height: 16px; }
.summary-strip { display: flex; gap: 8px 22px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 0 2px 12px; }
.summary-strip b { color: var(--text); font-weight: 600; }
.show-sm { display: none; }
.show-more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line); }

/* ============ Charts ============ */
.chart { width: 100%; min-height: 60px; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .hit { cursor: default; }
.chart .hit rect.hitbox { fill: transparent; }
.chart .hit:hover rect.hitbox { fill: color-mix(in srgb, var(--text) 4%, transparent); }
.chart .guide { stroke: var(--axis); stroke-width: 1; opacity: 0; }
.chart .hit:hover .guide { opacity: 1; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--dot); display: inline-block; }
.legend i.line { height: 2px; width: 14px; border-radius: 2px; }
.hbars { display: grid; gap: 11px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.hbar-label { display: flex; align-items: center; gap: 8px; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.hbar-label span.t { overflow: hidden; text-overflow: ellipsis; }
.hbar-track { position: relative; height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.hbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar, var(--c0)); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar-fill.warn { background: var(--warn); }
.hbar-fill.over { background: var(--crit); }
.hbar-marker { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-2); border-radius: 1px; }
.hbar-value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.hbar-value small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.progress { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--bar, var(--c0)); border-radius: 0 4px 4px 0; }
#tip {
  position: fixed; z-index: 200; pointer-events: none; opacity: 0; transform: translateY(4px);
  background: var(--surface-3); color: var(--text); border: 1px solid var(--line-2); border-radius: 10px;
  padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); transition: opacity .1s, transform .1s; max-width: 280px;
}
#tip.on { opacity: 1; transform: none; }
#tip .tt { font-weight: 600; margin-bottom: 4px; }
#tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-variant-numeric: tabular-nums; }
#tip .tr span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }

/* ============ Budget ============ */
.budget-row { display: grid; grid-template-columns: minmax(140px, 1.2fr) 120px minmax(120px, 2fr) 150px; gap: 16px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.budget-row:last-child { border-bottom: 0; }
.budget-row.head { font-size: 12px; color: var(--muted); padding-top: 4px; padding-bottom: 8px; }
.budget-row .input { height: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.budget-row .status { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.budget-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; }

/* ============ Payment cards ============ */
.pm-group { display: flex; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 650; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 10px; }
.pm-group:first-child { margin-top: 0; }
.pm-group span { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); opacity: .8; }
.pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.pm-item { display: grid; gap: 12px; }
.pm-card {
  position: relative; aspect-ratio: 1.586; border-radius: 16px; padding: 18px 20px; overflow: hidden; color: #f5f4ef;
  background: linear-gradient(140deg, color-mix(in srgb, var(--pmc) 55%, #101114) 0%, #111216 72%);
  border: 1px solid rgba(255,255,255,.09); display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; text-align: left; font: inherit; width: 100%;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.pm-card::after { content: ""; position: absolute; right: -40px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); }
.pm-card.archived { opacity: .5; }
.pm-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pm-name { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.pm-issuer { font-size: 12px; opacity: .7; }
.pm-type { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; opacity: .75; border: 1px solid rgba(255,255,255,.2); padding: 2px 7px; border-radius: 20px; }
.pm-chip { width: 34px; height: 25px; border-radius: 5px; background: linear-gradient(135deg, #d9c38a, #9b8550); opacity: .85; }
.pm-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
.pm-num { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; }
.pm-spend { font-size: 12px; opacity: .75; text-align: right; }
.pm-spend b { display: block; font-size: 17px; opacity: 1; letter-spacing: -.01em; font-family: var(--font); }
.pm-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 12.5px; color: var(--muted); padding: 0 4px; gap: 6px 18px; }
.pm-stats div { min-width: 0; display: flex; justify-content: space-between; gap: 8px; }
.pm-stats b { color: var(--text); font-weight: 600; white-space: nowrap; }

/* ============ Goals ============ */
.goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.goal { display: grid; gap: 12px; }
.goal-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.goal-amt { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -.03em; }
.goal-amt small { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.goal .progress { height: 10px; }
.goal-facts { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
.goal-facts b { color: var(--text); font-weight: 600; }

/* ============ Empty ============ */
.empty { text-align: center; padding: 44px 20px; display: grid; justify-items: center; gap: 10px; }
.empty .ico-tile { width: 48px; height: 48px; border-radius: 14px; --dot: var(--accent); }
.empty .ico-tile svg { width: 22px; height: 22px; }
.empty h3 { font-size: 16px; }
.empty p { color: var(--muted); max-width: 44ch; font-size: 13.5px; }
.empty .row { margin-top: 6px; justify-content: center; }

/* ============ Banner ============ */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--card-border); background: var(--surface); margin-bottom: 16px; font-size: 13.5px; }
.banner.accent { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.banner .grow { flex: 1; min-width: 0; }
.banner svg { color: var(--accent-text); }
.note { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.note svg { width: 15px; height: 15px; margin-top: 1px; }

/* ============ Modal ============ */
.modal-wrap {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px;
  background: rgba(5,5,6,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  animation: fade var(--dur-2) var(--ease-out);
}
.modal {
  width: 100%; max-width: 560px; max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--card-border); border-radius: 24px; box-shadow: var(--shadow);
  animation: pop var(--dur-3) var(--ease-out);
}
.modal.wide { max-width: 860px; }
.modal.narrow { max-width: 420px; }
.modal form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; }
.modal-h h2 { font-size: 19px; }
.modal-b { padding: 12px 20px 18px; overflow-y: auto; }
.modal-f { display: flex; gap: 8px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); }
.modal-f .spacer { flex: 1; }
.biz-box { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 16px 0 0; background: color-mix(in srgb, var(--accent) 4%, transparent); }
.biz-box .form-grid { margin-top: 14px; }
.biz-box legend { padding: 0; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } }

/* ============ Toast ============ */
#toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 300; display: grid; gap: 8px; justify-items: center; }
.toast { display: flex; align-items: center; gap: 12px; background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 550; font-size: 13.5px; box-shadow: var(--shadow); animation: pop .16s ease-out; }
.toast.err { background: var(--crit); color: #fff; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; padding: 0; }

/* ============ Settings ============ */
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .sr-t { font-weight: 550; }
.set-row .sr-d { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.set-row .select { width: auto; min-width: 120px; }
.input-wrap .suffix { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.facts { display: grid; gap: 8px; font-size: 13px; }
.facts div { display: flex; gap: 10px; align-items: flex-start; }
.facts svg { color: var(--pos); width: 16px; height: 16px; margin-top: 2px; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--line-2); border-radius: 20px; font-size: 12.5px; background: var(--surface-2); }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 2px; border-radius: 50%; }
.chip button:hover { color: var(--text); background: var(--surface-3); }
.chip button svg { width: 13px; height: 13px; }
.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px; align-items: center; }
.changelog { display: grid; gap: 18px; }
.cl-date { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.cl-items { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.cl-items li { font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
.danger-zone { border-color: color-mix(in srgb, var(--crit) 40%, transparent); }

/* ============ Import ============ */
.dropzone { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 26px; text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--text-2); }
.preview-table { font-size: 12.5px; }
.preview-table td, .preview-table th { padding: 7px 10px; }

/* ============ Responsive ============ */
@media (max-width: 1180px) {
  .s3 { grid-column: span 6; } .s4 { grid-column: span 6; } .s5, .s7 { grid-column: span 12; }
  .s8 { grid-column: span 12; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .nav-open .sidebar { transform: none; }
  .nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 25; }
  .menu-btn { display: inline-flex; }
  .main { padding: 0 16px 90px; }
  .topbar { gap: 8px; margin-bottom: 16px; padding: 10px 0; }
  .topbar h1 { font-size: 17px; }
  .month-nav .ml { min-width: 0; padding: 7px 2px; font-size: 13px; }
  .add-label { display: none; }
  .s3, .s4, .s6 { grid-column: span 12; }
  .lock { grid-template-columns: minmax(0, 1fr); }
  .lock-intro { padding: 36px 22px 0; gap: 22px; }
  .lock-facts { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .lock-facts div { display: flex; gap: 8px; align-items: baseline; }
  .lock-facts b { margin: 0; white-space: nowrap; }
  .set-grid { grid-template-columns: minmax(0, 1fr); }
  .hide-md { display: none; }
  .budget-row { grid-template-columns: minmax(0, 1fr) 96px; gap: 8px 12px; }
  .budget-row .b-bar { grid-column: 1 / -1; }
  .budget-row .status { grid-column: 1 / -1; text-align: left; }
  .budget-row.head { display: none; }
}
@media (max-width: 620px) {
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .stat { padding: 12px 13px; }
  .stat-value { font-size: 20px; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .modal-wrap { padding: 0; place-items: end stretch; }
  .modal, .modal.wide, .modal.narrow { max-width: none; max-height: 92vh; border-radius: 18px 18px 0 0; }
  .hide-sm { display: none; }
  .show-sm { display: block; }
  .hbar { grid-template-columns: minmax(70px, 110px) minmax(0, 1fr) auto; gap: 8px; }
  .table .desc, .table .sub { max-width: 180px; }
  .month-nav .ml { font-size: 12.5px; }
  .toolbar .select { flex: 1 1 40%; min-width: 0; }
  .toolbar .search { max-width: none; flex-basis: 100%; }
  .lock-panel { padding: 22px; }
  .banner { flex-wrap: wrap; }
  .banner .grow { flex-basis: calc(100% - 40px); }
  #toasts { top: 14px; bottom: auto; }
}

/* ============ Print (CPA summary) ============ */
@media print {
  :root { color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #f4f4f4; --text: #000; --text-2: #333; --muted: #555; --line: #ddd; --line-2: #ccc; }
  .sidebar, .topbar, .no-print, #toasts, #tip { display: none !important; }
  .app { display: block; }
  .main { padding: 0; }
  .card { break-inside: avoid; border-color: #ccc; }
  .privacy .amt { filter: none; }
}
.cat-glyph { display: inline-flex; align-items: center; justify-content: center; width: 16px;
  font-size: 12px; line-height: 1; flex: none; }

/* ============ Bills calendar ============ */
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-dow { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase;
  letter-spacing: .06em; padding: 2px 4px 6px; }
.cal-cell { min-height: 84px; border: 1px solid var(--line); border-radius: 10px; padding: 6px;
  display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.cal-cell.blank { border: 0; background: none; min-height: 0; }
.cal-cell.past { opacity: .55; }
.cal-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px;
  font-weight: 600; color: var(--text-2); }
.cal-day .amt { font-size: 11px; color: var(--muted); font-weight: 500; }
.cal-pill { display: block; width: 100%; text-align: left; font: inherit; font-size: 11px;
  line-height: 1.3; padding: 3px 6px; border-radius: 6px; border: 0; cursor: pointer;
  background: var(--surface-3); color: var(--text-2); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.cal-pill:hover { background: var(--accent-soft); color: var(--accent-text); }
.cal-pill.in { background: color-mix(in srgb, var(--pos) 16%, transparent); color: var(--pos); }
.cal-pill.card { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.cal-more { font-size: 10.5px; color: var(--muted); padding-left: 6px; }
@media (max-width: 720px) {
  .cal-cell { min-height: 62px; padding: 4px; }
  .cal-pill { font-size: 10px; }
}

/* ============ Reports ============ */
.rep-list { display: grid; gap: 8px; }
.rep-row { display: grid; grid-template-columns: minmax(84px, 22%) 1fr auto auto; gap: 10px;
  align-items: center; font-size: 13px; }
.rep-k { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep-bar { background: var(--surface-3); border-radius: 999px; height: 10px; overflow: hidden; }
.rep-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.rep-v { font-weight: 600; }
.rep-n { min-width: 24px; text-align: right; }

/* ============ Number hierarchy ============
   One scale for figures, so a headline number is the same size wherever it
   appears. Before this each card invented its own, which is the main reason a
   page of cards can look assembled rather than designed. */
.stat-lg { font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
.stat-md { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

/* ============ Density ============
   680 transactions is a lot of scrolling at comfortable spacing. Compact is
   for people who are reading the table rather than glancing at it. */
body.compact .table td { padding-top: 7px; padding-bottom: 7px; }
body.compact .table th { padding-top: 6px; padding-bottom: 6px; }
body.compact .list-item { padding-top: 8px; padding-bottom: 8px; }
body.compact .card { padding: 14px 16px; }
body.compact .desc { font-size: 13px; }
body.compact .sub { display: none; }

/* ============ Mobile ============
   The recurring complaint about every app in this category is that the phone
   version is an afterthought. These are the spots where this one broke. */
@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .row.wrap { gap: 14px !important; }
  .stat-lg { font-size: 19px; }
  .toolbar { flex-wrap: wrap; gap: 8px; }
  .toolbar .select, .toolbar .input { flex: 1 1 140px; min-width: 0; }
  .summary-strip { flex-wrap: wrap; gap: 8px 14px; font-size: 12px; }
  .rep-row { grid-template-columns: minmax(64px, 30%) 1fr auto; }
  .rep-n { display: none; }
  .pm-grid { grid-template-columns: 1fr; }
  .seg { width: 100%; }
  .seg button { flex: 1; }
  /* A modal that fills the screen is easier to use than one that floats in a
     small window on a small screen. */
  .modal { max-height: 92vh; }
}

/* ============ Goals as things ============ */
.goal-hero { border-radius: 12px; overflow: hidden; background: var(--surface-2); margin-bottom: 16px;
  display: grid; place-items: center; max-height: 320px; }
.goal-hero img { width: 100%; max-height: 320px; object-fit: contain; display: block; }
.goal-thumb { width: 40px; height: 40px; border-radius: 9px; overflow: hidden; flex: none;

function billsInMonth(mk) {
  const first = mk + '-01';
  const dim = new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate();
  const last = mk + '-' + pad(dim);
  const byDay = new Map();
  const add = (date, item) => {
    const day = Number(date.slice(8, 10));
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(item);
  };

  for (const r of S.recurring) {
    if (r.active === false || !r.next) continue;
    // Rewind to at or before the month, then walk forward through it. Both
    // loops are bounded so a schedule that cannot advance cannot hang.
    let d = r.next;
    let guard = 0;
    while (d > last && guard++ < 60) {
      const p = prevDate(d, r.freq, r.anchor);
      if (!p || p >= d) break;
      d = p;
    }
    guard = 0;
    while (d <= last && guard++ < 60) {
      if (d >= first) add(d, { kind: 'bill', id: r.id, name: r.name, amount: r.amount, type: r.type });
      const nx = nextDate(d, r.freq, r.anchor);
      if (!nx || nx <= d) break;
      d = nx;
    }
  }

  for (const p of S.paymentMethods) {
    if (p.archived || p.type !== 'credit' || !p.dueDay) continue;
    const day = Math.min(Number(p.dueDay), dim);
    if (day >= 1) add(mk + '-' + pad(day), { kind: 'card', id: p.id, name: p.name, color: p.color });
  }

  return { byDay, dim, firstWeekday: new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)) - 1, 1).getDay() };
}

function nextDate(s, freq, anchor) {
  const d = parseD(s);
  if (freq === 'weekly') { d.setDate(d.getDate() + 7); return dStr(d); }
  if (freq === 'biweekly') { d.setDate(d.getDate() + 14); return dStr(d); }
  const n = { monthly: 1, quarterly: 3, yearly: 12 }[freq] || 1;
  const day = anchor || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(day, dim));
  return dStr(t);
}
function timeAgo(iso) {
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  const rows = []; let row = []; let f = ''; let q = false;
  text = String(text).replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); f = '';
      if (row.some((x) => x.trim() !== '')) rows.push(row);
      row = [];
    } else f += c;
  }
  row.push(f);
  if (row.some((x) => x.trim() !== '')) rows.push(row);
  return rows;
}
/* Guards against spreadsheet formula injection in exported text cells */
function csvCell(v, isText = true) {
  let s = String(v ?? '');
  if (isText && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCSV(header, rows, numericCols = []) {
  const lines = [header.map((h) => csvCell(h)).join(',')];
  for (const r of rows) lines.push(r.map((v, i) => csvCell(v, !numericCols.includes(i))).join(','));
  return lines.join('\r\n');
}
async function downloadFile(name, content, type = 'text/plain') {
  const dl = typeof Cloud !== 'undefined' ? Cloud.caps.downloads : null;
  if (dl) {
    try { await dl.save({ filename: name, data: content }); return true; }
    catch (e) { if (e && e.code !== 'declined') toast(e && e.code === 'rate_limited' ? 'A download is already waiting for your OK' : 'Downloads are not available here', 'err'); return false; }
  }
  try {
    const blob = content instanceof Blob ? content : new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { toast('Downloads are not available here', 'err'); return false; }
}
function readFileText(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error); r.readAsText(file); });
}
function parseLooseDate(s) {
  s = String(s || '').trim();
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return mk(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return mk(y, +m[1], +m[2]); }

  return isNaN(d) ? null : dStr(d);

}

   Cloud store: this app's own server, scoped to the signed-in user.
   (Ported from the claude.ai artifact version — that one used the
   platform's per-viewer db capability; this one talks to /api/ledger/docs

     config        settings, categories, cards, businesses, rules, recurring
     wealth        accounts, holdings, goals, net-worth snapshots
     inbox         items waiting for review (page imports + bank sync)

const Prefs = {
  get(k, d) { try { const v = localStorage.getItem('lvc-' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lvc-' + k, v); } catch (e) { /* ignore */ } },

const Cloud = {
  mode: 'loading',          // 'cloud' | 'demo'
  db: null, uid: null, col: null, unsub: null,
  // Receipt photos and AI-assisted import need capabilities this
  // self-hosted build doesn't have — buttons that need them already show
  // a clear "not available here" tooltip instead of erroring.
  caps: { sample: null, assets: null, downloads: null, limits: null },
  seen: new Map(),          // docId -> JSON string known to be on the server
  docs: new Map(),          // docId -> latest server body
  queues: new Map(),        // docId -> promise chain (one write at a time per doc)
  pending: 0, error: null, onRemote: null,

  async init() {
    // Minimal shim matching the shape save()/enqueue() below expect:
    // this.col.doc(id).set(body) / .delete()
    this.col = {
      doc: (id) => ({
        set: async (body) => {
          const res = await fetch(`/api/ledger/docs/${encodeURIComponent(id)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            const e = new Error('save failed');
            e.code = res.status === 413 ? 'quota_exceeded' : res.status === 401 ? 'unauthenticated' : 'unknown';
            throw e;
          }
        },
        delete: async () => {
          const res = await fetch(`/api/ledger/docs/${encodeURIComponent(id)}`, { method: 'DELETE' });
          if (!res.ok && res.status !== 404) {
            const e = new Error('delete failed');
            e.code = res.status === 401 ? 'unauthenticated' : 'unknown';
            throw e;
          }
        },
      }),
    };
    try {
      const res = await fetch('/api/ledger/docs');
      if (res.status === 401) { window.location.href = '/login.html'; return null; }
      if (!res.ok) throw new Error(`load failed: ${res.status}`);
      const body = await res.json();
      for (const [id, doc] of Object.entries(body)) {
        this.docs.set(id, doc);
        this.seen.set(id, JSON.stringify(doc));
      }
      this.mode = 'cloud';
      return this.docs;
    } catch (e) {
      console.error('db', e);
      this.mode = 'demo';
      return null;
    }
  },

  /* Build the document set from state and write only what changed. */
  save(state) {
    if (this.mode !== 'cloud') return Promise.resolve();
    const want = docsFromState(state);
    const jobs = [];
    for (const [id, body] of want) {
      const json = JSON.stringify(body);
      if (this.seen.get(id) === json) continue;
      if (json.length > 250000) { toast(`${id} is too large to save. Split or archive older data.`, 'err'); continue; }
      this.seen.set(id, json);
      jobs.push(this.enqueue(id, () => this.col.doc(id).set(body), json));
    }
    for (const id of [...this.seen.keys()]) {
      if (want.has(id) || !/^(tx-|trips-)/.test(id)) continue;
      this.seen.delete(id);
      jobs.push(this.enqueue(id, () => this.col.doc(id).delete(), null));
    }
    return Promise.all(jobs);
  },
  enqueue(id, fn, json) {
    this.pending++; setSync('saving');
    const prev = this.queues.get(id) || Promise.resolve();
    const run = prev.then(fn).then(() => { this.error = null; }, (e) => {
      console.error('save', id, e);
      this.error = e && e.code;
      if (json != null) this.seen.delete(id); // force a retry on the next save
      toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete old data to keep saving.' : 'Could not save. Your last change will retry.', 'err');
    }).finally(() => { this.pending--; setSync(this.pending ? 'saving' : this.error ? 'error' : 'saved'); });
    this.queues.set(id, run);
    return run;
  },
};

const INBOX_MAX = 700;
function chunkByBytes(items, max = 190000) {
  const out = []; let cur = []; let size = 0;
  for (const it of items) {
    const n = JSON.stringify(it).length + 1;
    if (cur.length && size + n > max) { out.push(cur); cur = []; size = 0; }
    cur.push(it); size += n;
  }
  if (cur.length) out.push(cur);
  return out;
}
function docsFromState(st) {
  const m = new Map();
  m.set('config', {
    v: 2, settings: st.settings, categories: st.categories, paymentMethods: st.paymentMethods,
    businesses: st.businesses, bizCats: st.bizCats, rules: st.rules, recurring: st.recurring, reports: st.reports, createdAt: st.createdAt,
  });
  m.set('wealth', { accounts: st.accounts, holdings: st.holdings, goals: st.goals, snapshots: st.snapshots });
  m.set('inbox', { items: st.inbox.slice(0, INBOX_MAX) });
  const months = new Map();
  for (const t of st.transactions) { const k = t.date.slice(0, 7); if (!months.has(k)) months.set(k, []); months.get(k).push(t); }
  for (const [k, list] of months) {
    list.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || 0) - (b.created || 0)));
    chunkByBytes(list).forEach((part, i) => m.set(`tx-${k}${i ? '.' + (i + 1) : ''}`, { month: k, txs: part }));
  }
  const years = new Map();
  for (const t of st.trips) { const y = t.date.slice(0, 4); if (!years.has(y)) years.set(y, []); years.get(y).push(t); }
  for (const [y, list] of years) m.set(`trips-${y}`, { year: y, trips: list.sort((a, b) => (a.date < b.date ? -1 : 1)) });
  return m;
}
function stateFromDocs(docs) {
  const cfg = docs.get('config') || {}; // no config yet: defaults, but keep anything already written (e.g. inbox items from chat)
  const w = docs.get('wealth') || {};
  const txs = [], trips = [];
  for (const [id, body] of docs) {
    if (id.startsWith('tx-') && Array.isArray(body.txs)) txs.push(...body.txs);
    if (id.startsWith('trips-') && Array.isArray(body.trips)) trips.push(...body.trips);

  return normalizeState({
    ...cfg, accounts: w.accounts, holdings: w.holdings, goals: w.goals, snapshots: w.snapshots,
    inbox: ((docs.get('inbox') || {}).items) || [], transactions: txs, trips,
  });
}

/* =========================================================
   v1 (Ledger Vault) backup decryption, for one-time migration.
   ========================================================= */
const b64 = {
  dec(str) { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },
};
const V1 = {
  isBlob(b) { return !!b && typeof b === 'object' && b.app === 'ledger-vault' && b.format === 1 && typeof b.salt === 'string' && typeof b.ct === 'string' && Number.isInteger(b.iter); },
  async open(password, blob) {
    const TE = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', TE.encode(password.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64.dec(blob.salt), iterations: blob.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const aad = TE.encode(`ledger-vault|1|PBKDF2-SHA256|${blob.iter}|${blob.salt}`);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(blob.iv), additionalData: aad, tagLength: 128 }, key, b64.dec(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  },
};

// A month summarised against the one before it. Everything here comes from
// transactions already in the books, so there is no new state to keep in sync.
/* ---------- Cash flow forecast ----------
   Everything else in the app describes what already happened. This is the
   one thing that looks forward: from what is liquid today, walk the bill and
   income schedule out day by day and see where the balance goes.

   The number that matters is not the end balance, it is the lowest point and
   the day it lands on — that is the day something bounces. Discretionary
   spending is a flat daily average from the last 90 days, which is crude but
   honest; the alternative is pretending day-to-day spending is predictable. */
const LIQUID_TYPES = ['checking', 'savings', 'cash'];
function cashForecast(days = 60) {
  const liquid = S.accounts.filter((a) => a.kind === 'asset' && LIQUID_TYPES.includes(a.type));
  const start = sum(liquid, (a) => a.balance);
  const today = todayStr();
  const end = addDays(today, days);

  // Day-to-day spending, averaged. Scheduled items are excluded so they are
  // not counted twice — they arrive through the schedule below.
  const since = addDays(today, -90);
  const loose = S.transactions.filter((t) => t.type === 'expense' && t.date >= since && t.date < today && !t.rec);
  const daily = loose.length ? Math.round(sum(loose, (t) => t.amount) / 90) : 0;

  const events = [];
  for (const r of S.recurring) {
    if (r.active === false || !(r.amount > 0)) continue;
    let d = r.next;
    let guard = 0;
    while (d <= end && guard++ < 400) {
      if (d >= today) events.push({ date: d, name: r.name, amount: r.type === 'income' ? r.amount : -r.amount });
      const nxt = nextDate(d, r.freq, r.anchor);
      if (!nxt || nxt <= d) break;   // never loop on a schedule that cannot advance
      d = nxt;
    }
  }

  const points = [];
  let balance = start;
  let low = { balance: start, date: today };
  for (let k = 0; k <= days; k++) {
    const date = addDays(today, k);
    if (k > 0) {
      balance -= daily;
      for (const e of events) if (e.date === date) balance += e.amount;
    }
    points.push({ date, balance });
    if (balance < low.balance) low = { balance, date };
  }

  const income = sum(events.filter((e) => e.amount > 0), (e) => e.amount);
  const bills = -sum(events.filter((e) => e.amount < 0), (e) => e.amount);
  return { start, points, low, daily, events, income, bills, days,
    end: points[points.length - 1].balance, hasAccounts: liquid.length > 0 };
}

/* ---------- Refunds ----------
   Money coming back from a merchant you paid is not income, but it lands in
   the books looking exactly like income, which quietly inflates what you
   appear to earn and flatters the savings rate.

   This finds them rather than asking you to mark them: an incoming amount

function detectRefunds() {
  const out = [];

  for (const t of S.transactions) {
    if (t.type !== 'income') continue;
    const key = nameKey(t.desc);
    if (!key || key.length < 3) continue;
    let match = null;
    for (const s of spends) {
      if (s.amount !== t.amount) continue;
      if (s.date > t.date) continue;                    // a refund follows its purchase
      if (daysBetween(s.date, t.date) > REFUND_WINDOW_DAYS) continue;
      if (nameKey(s.desc) !== key) continue;
      if (!match || s.date > match.date) match = s;     // the most recent candidate
    }
    if (match) out.push({ t, original: match });

  for (const t of S.transactions) {
    if (t.type !== 'expense' || !t.date.startsWith(mk)) continue;
    count++;

    const c = catOf(t.cat);

    .map(([id, amount]) => ({ cat: catOf(id), amount }))

    if (r.active === false || !r.name || !(r.amount > 0)) continue;
    const key = norm(r.name);
    let latest = null;
    for (const t of S.transactions) {
      if (t.type !== r.type) continue;
      if (!norm(t.desc).includes(key)) continue;
      if (!latest || t.date > latest.date) latest = t;

    if (!latest) continue;

// so the import path and the re-scan cannot drift apart.
//
// What it will not do is overrule a choice already made: an existing write-off
// category or business assignment is kept and only the missing pieces filled
// in. Returns true when it changed something.
function ensurePropFirmBiz(t) {
  if (t.type !== 'income' && t.type !== 'expense') return false;
  if (!detectPropFirmName(t.desc)) return false;
  const pf = propFirmBizFor(t.desc, t.type);
  if (!pf) return false;            // no trading business configured
  if (!t.biz) { t.biz = pf; return true; }
  let changed = false;
  if (!t.biz.firm) { t.biz.firm = pf.firm; changed = true; }
  if (!t.biz.b) { t.biz.b = pf.b; changed = true; }
  if (t.type === 'expense' && !t.biz.c && pf.c) { t.biz.c = pf.c; changed = true; }
  if (!(Number(t.biz.pct) > 0)) { t.biz.pct = 100; changed = true; }
  return changed;
}

function propFirmBizFor(desc, type) {
  if (type !== 'income' && type !== 'expense') return null;
  const firm = detectPropFirmName(desc);
  if (!firm) return null;
  const tradingBiz = S.businesses.find((b) => b.kind === 'trading');
  if (!tradingBiz) return null;
  if (type === 'income') return { b: tradingBiz.id, c: '', pct: 100, firm, receipt: false, rnote: '' };
  const key = /reset|reactivat/i.test(desc) ? 'reset' : 'eval';
  const bc = S.bizCats.find((c) => c.key === key) || S.bizCats.find((c) => c.scope === 'trading');
  return { b: tradingBiz.id, c: bc ? bc.id : '', pct: 100, firm, receipt: false, rnote: '' };
}

/* ---------- Needs Review ----------
   Bank-synced transactions land straight in the books now, which is faster but
   means nothing stops to ask when the data is thin. These are the cases where
   a row is in your books but its meaning is genuinely unclear, so totals and
   write-offs built on it would be wrong.

   Every reason here is an objective property of the row, not a guess about
   your intent — the point is to hand you the ambiguous ones, not to decide
   for you. Reasons are ordered by how much damage leaving them does. */
function needsReview() {
  const out = [];
  const seen = new Set();
  const add = (t, why, hint) => { if (seen.has(t.id)) return; seen.add(t.id); out.push({ t, why, hint }); };

  for (const t of sortTx(S.transactions)) {
    // Explicitly marked as fine by the person. Every reason here is a
    // judgement call, so there has to be a way to disagree with one for good
    // rather than being nagged about it forever.
    if (t.reviewed) continue;
    // A transfer carrying a real merchant name usually isn't an internal
    // move between your own accounts — and a transfer counts toward nothing,
    // so a misfiled payout or fee vanishes from every total.
    if (t.type === 'transfer' && detectPropFirmName(t.desc)) {
      add(t, 'Filed as a transfer, but looks like a prop firm', 'Was this a payout or a fee?');
      continue;
    }
    // A business expense with no write-off category can't be reported on.
    if (t.biz && t.type === 'expense' && !t.biz.c) {
      add(t, 'Business expense with no write-off category', 'Pick how your CPA should group it.');
      continue;
    }
    // Trading business rows with no firm are missing from Prop Firms.
    if (t.biz && !t.biz.firm && (S.businesses.find((b) => b.id === t.biz.b) || {}).kind === 'trading') {
      add(t, 'Trading business, but no firm named', 'Name the firm so it counts in Prop Firms.');
      continue;
    }
    if (t.type === 'transfer') continue;
    // No category at all: counts in the totals but not in any breakdown.
    if (!t.cat || !catOf(t.cat)) {
      add(t, 'No category', 'It won’t appear in budgets or spending breakdowns.');
      continue;
    }
    // Landed on the catch-all. Fine for small change, worth a look when the
    // amount is large enough to move a monthly total.
    const c = catOf(t.cat);
    if (c && /^other/i.test(c.name) && t.amount >= 10000) {
      add(t, `Categorised as ${c.name}`, 'Large enough to be worth placing properly.');
    }
  }
  // Money back from a merchant you paid, sitting in the books as income.
  for (const { t, original } of detectRefunds()) {
    add(t, 'Looks like a refund, not income',
      'Matches ' + original.desc + ' on ' + fmtDate(original.date) + '. Counting it as income overstates what you earn.');
  }
  return out;
}

// The month, in the terms you would describe it to someone: more or less than
// last month, where it went, and the one purchase that stands out.
// The forecast, stated plainly. The lowest point leads because that is the
// day that actually matters; the ending balance is the reassuring number and
// the least useful one.
// A month of bills laid out as a month. Days with nothing stay empty on
// purpose: the gaps are what make a heavy week visible at a glance.
function billsCalendarHTML(mk) {
  const { byDay, dim, firstWeekday } = billsInMonth(mk);
  if (!byDay.size) return '';
  const today = todayStr();
  const cells = [];
  for (let k = 0; k < firstWeekday; k++) cells.push('<div class="cal-cell blank"></div>');
  for (let day = 1; day <= dim; day++) {
    const date = mk + '-' + pad(day);
    const items = byDay.get(day) || [];
    const isToday = date === today;
    const past = date < today;
    const total = items.filter((x) => x.kind === 'bill' && x.type === 'expense').reduce((a, x) => a + x.amount, 0);
    const pills = items.slice(0, 3).map((x) => x.kind === 'card'
      ? '<button class="cal-pill card" data-act="pm-edit" data-id="' + x.id + '" title="Card payment due">' + esc(x.name) + '</button>'
      : '<button class="cal-pill ' + (x.type === 'income' ? 'in' : '') + '" data-act="rec-edit" data-id="' + x.id + '">' + esc(x.name) + '</button>').join('');
    const more = items.length > 3 ? '<span class="cal-more">+' + (items.length - 3) + ' more</span>' : '';
    cells.push('<div class="cal-cell' + (isToday ? ' today' : '') + (past ? ' past' : '')
      + '"><div class="cal-day">' + day + (total ? '<span class="amt">' + esc(money(total, { whole: true })) + '</span>' : '')
      + '</div>' + pills + more + '</div>');
  }
  const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    .map((d) => '<div class="cal-dow">' + d + '</div>').join('');
  return UI.card('Bills calendar',
    '<div class="cal-grid">' + dows + cells.join('') + '</div>',
    { sub: monthLabel(mk), cls: 's12' });
}

function forecastHTML() {

/* ---------- This week ----------
   A short read on the last seven days against the seven before them. Weekly is
   the cadence that catches drift while it is still worth reacting to: monthly
   is too late to change anything, daily is noise. */
function weekReview() {
  const today = todayStr();
  const startCur = addDays(today, -6);
  const startPrev = addDays(today, -13);
  let cur = 0, prev = 0, n = 0;
  let top = null;
  const byCat = new Map();
  for (const t of S.transactions) {
    if (t.type !== 'expense') continue;
    if (t.date >= startCur && t.date <= today) {
      cur += t.amount; n++;
      if (!top || t.amount > top.amount) top = t;
      const c = catOf(t.cat);
      const k = c ? c.name : 'Uncategorised';
      byCat.set(k, (byCat.get(k) || 0) + t.amount);
    } else if (t.date >= startPrev && t.date < startCur) {
      prev += t.amount;
    }
  }
  const lead = [...byCat.entries()].sort((a, b) => b[1] - a[1])[0] || null;
  const due = upcoming(7);
  return { cur, prev, delta: cur - prev, n, top, lead, due, startCur, today };
}
function weekReviewHTML() {
  const w = weekReview();
  if (!w.n && !w.due.length) return '';
  const dirWord = w.delta > 0 ? 'more' : 'less';
  const compare = w.prev
    ? `${esc(money(Math.abs(w.delta)))} ${dirWord} than the week before`
    : 'Nothing spent the week before to compare against';
  const leadLine = w.lead ? `Most of it went to ${esc(w.lead[0])} (${esc(money(w.lead[1]))}).` : '';
  const dueLine = w.due.length
    ? `${plural(w.due.length, 'bill')} due in the next seven days, ${esc(money(sum(w.due, (r) => r.amount)))} in total.`
    : 'No bills due in the next seven days.';
  const topLine = w.top ? `Biggest: ${esc(w.top.desc)} at ${esc(money(w.top.amount))}.` : '';
  return UI.card('This week', `
    <div class="figures">
      <div><div class="muted small">Spent</div><div class="amt stat-lg">${esc(money(w.cur))}</div></div>
      <div><div class="muted small">Purchases</div><div class="stat-lg">${w.n}</div></div>
    </div>
    <p class="text-2" style="margin-bottom:6px">${compare}. ${leadLine}</p>
    <p class="text-2" style="margin-bottom:6px">${topLine}</p>
    <p class="muted small">${dueLine}</p>`,
    { sub: `${fmtDate(w.startCur)} – ${fmtDate(w.today)}`, cls: 's6' });
}

function monthReviewHTML(mk) {

/* ---------- What the Prop Firms section is missing ----------
   Only transactions carrying a trading business *and* a firm name are counted
   by propFirmStats, so anything that arrived before auto-detection existed,
   anything Plaid filed as a transfer, and anything whose description didn't
   match a known firm is silently absent. This finds those so the gap is
   visible and fixable rather than just wrong.

   Transfers are listed separately: a transfer row keeps no direction, so
   whether it was a payout or a fee is genuinely unknown and has to be asked
   rather than guessed. */
function propFirmUnattributed() {
  const clear = [], unclear = [];
  for (const t of S.transactions) {
    if (t.biz && t.biz.firm) continue;
    const firm = detectPropFirmName(t.desc);
    if (!firm) continue;
    (t.type === 'transfer' ? unclear : clear).push({ t, firm });
  }
  const byDate = (a, b) => (a.t.date < b.t.date ? 1 : -1);
  return { clear: clear.sort(byDate), unclear: unclear.sort(byDate) };
}

// Earliest transaction in the books, so a short history window is visible as
// a date rather than as mysteriously absent purchases.
function propFirmCoverage() {
  let first = null;
  for (const t of S.transactions) if (!first || t.date < first) first = t.date;
  return first;
}

function attributeToFirm(t, forceType) {
  const type = forceType || t.type;
  if (type !== 'income' && type !== 'expense') return false;
  const biz = propFirmBizFor(t.desc, type);
  if (!biz) return false;
  t.type = type;
  t.biz = biz;
  const wantName = type === 'income' ? 'Trading payouts' : 'Prop firm';
  const c = byName(catsOfKind(type), wantName);
  if (c) t.cat = c.id;
  return true;
}

// Wider net than PROP_FIRM_PATTERNS. Firms bill under legal entity names,
// resellers and payment processors that look nothing like the brand, so an
// exact list will always miss some. These are generic words that show up in
// trading-related descriptors; matches are *candidates* shown for a human to
// judge, never auto-attributed, because plenty of innocent merchants contain
// "trading" or "futures" too.
const PROP_FIRM_HINTS = [
  'trader', 'trading', 'funded', 'funding', 'futures', 'prop firm', 'propfirm',
  'evaluation', 'challenge', 'payout', 'tradovate', 'rithmic', 'ninjatrader',
  'paddle', 'fastspring', 'merchant of record', 'prop',
];
const COMPANY_NAME = /\b(llc|l\.l\.c|inc|incorporated|ltd|limited|llp|lp|capital|holdings|partners|group)\b/i;
function propFirmCandidates() {
  const out = [];
  for (const t of sortTx(S.transactions)) {
    if (t.biz && t.biz.firm) continue;          // already counted somewhere
    if (detectPropFirmName(t.desc)) continue;   // the exact list already has it
    const d = norm(t.desc);
    if (PROP_FIRM_HINTS.some((h) => d.includes(h))) { out.push({ t, why: 'mentions trading' }); continue; }
    if (t.type === 'income' && COMPANY_NAME.test(t.desc)) { out.push({ t, why: 'money in from a company' }); }
  }
  return out;
}

/* ---------- Re-scan ----------
   Detection improves over time — new firms get added, patterns get fixed —
   but transactions are categorised once, when they arrive. Without this,
   every improvement only helps transactions you have not imported yet, and
   the only way to benefit was to wipe everything and re-import.

   This fills gaps only. A row that already carries a firm, a category or a
   business keeps what it has: the person may well have set it deliberately,
   and quietly overwriting that would be worse than missing a match. Every
   change is snapshotted so the whole pass can be undone in one go. */
function rescanTransactions() {
  const snaps = [];
  const counts = { firms: 0, cats: 0, rules: 0 };

  for (const t of S.transactions) {
    const before = { id: t.id, cat: t.cat, biz: t.biz ? JSON.parse(JSON.stringify(t.biz)) : null, type: t.type };
    let touched = false;

    // Transfers are left alone: the row keeps no direction, so whether a
    // prop firm transfer was a payout or a fee is unknowable here. The
    // review panel asks instead of guessing.
    if (t.type !== 'transfer') {
      if (ensurePropFirmBiz(t)) { counts.firms++; touched = true; }
      if (!t.cat || !catOf(t.cat)) {
        const rule = matchRule(t.desc);
        const rc = rule && catOf(rule.cat);
        if (rc && rc.kind === t.type) { t.cat = rule.cat; counts.rules++; touched = true; }
      }
      if ((!t.cat || !catOf(t.cat)) && t.biz && t.biz.firm) {
        const wantName = t.type === 'income' ? 'Trading payouts' : 'Prop firm';
        const c = byName(catsOfKind(t.type), wantName);
        if (c) { t.cat = c.id; counts.cats++; touched = true; }
      }
    }
    if (touched) snaps.push(before);
  }
  return { snaps, counts };
}
function undoRescan(snaps) {
  for (const s of snaps) {
    const t = byId(S.transactions, s.id);
    if (!t) continue;
    t.cat = s.cat; t.biz = s.biz; t.type = s.type;
  }
}

function propFirmReviewHTML() {
  const { clear, unclear } = propFirmUnattributed();
  const first = propFirmCoverage();
  const coverage = first
    ? `Counting transactions back to ${esc(fmtDate(first, { year: true }))}. Anything older than that isn't in your books yet — Plaid only backfills as much history as was requested when each bank was linked.`
    : '';

  const candidates = propFirmCandidates();
  if (!clear.length && !unclear.length && !candidates.length) {
    return coverage ? `<div class="card"><p class="note">${icon('info')}<span>${coverage}</span></p></div>` : '';
  }

  const row = (p, ask) => {
    const t = p.t;
    const act = ask
      ? `<button class="btn sm" data-act="firm-fix" data-id="${t.id}" data-kind="income">Payout</button><button class="btn sm" data-act="firm-fix" data-id="${t.id}" data-kind="expense">Fee</button>`
      : `<button class="btn sm primary" data-act="firm-fix" data-id="${t.id}">Add to ${esc(p.firm)}</button>`;
    return `<div class="list-item"><div class="li-main"><div class="li-title">${esc(t.desc)}</div><div class="li-sub">${esc(fmtDate(t.date, { year: true }))} · ${esc(p.firm)}${ask ? ' · filed as a transfer' : ` · ${t.type === 'income' ? 'payout' : 'fee'}`}</div></div><span class="amt ${t.type === 'income' ? 'pos' : ''}">${esc(money(t.amount))}</span>${act}</div>`;
  };

  const cards = [];
  if (clear.length) {
    cards.push(UI.card(`${plural(clear.length, 'transaction')} not counted yet`,
      `<p class="text-2" style="margin-bottom:10px">These match a prop firm by name but aren't attributed to one, so they're missing from the totals above.</p><div class="list">${clear.map((p) => row(p, false)).join('')}</div>`,
      { cls: 's12', actions: `<button class="btn sm primary" data-act="firm-fix-all">Add all ${clear.length}</button>` }));
  }
  if (unclear.length) {
    cards.push(UI.card(`${plural(unclear.length, 'transfer')} needing a call`,
      `<p class="text-2" style="margin-bottom:10px">Your bank reported these as transfers, which is how prop firm payouts usually arrive. A transfer doesn't record which way the money went, so say which these were and they'll be counted.</p><div class="list">${unclear.map((p) => row(p, true)).join('')}</div>`,
      { cls: 's12' }));
  }
  if (candidates.length) {
    const shown = candidates.slice(0, moreLimit('firmCandidates', 15, candidates.length));
    const rows = shown.map(({ t, why }) => `<div class="list-item click" data-act="tx-edit" data-id="${t.id}">
      <div class="li-main"><div class="li-title">${esc(t.desc)}</div><div class="li-sub">${esc(fmtDate(t.date, { year: true }))} · ${esc(t.type)} · ${esc(why)}</div></div>
      <span class="amt ${t.type === 'income' ? 'pos' : ''}">${esc(money(t.amount))}</span>
    </div>`).join('');
    cards.push(UI.card('Possible prop firm activity', `<p class="text-2" style="margin-bottom:10px">Not attributed to a firm, so not in the totals above — either they mention trading, or they're money in from something calling itself a company, which is the shape a payout takes. Plenty will be unrelated, so nothing here is counted until you say so. Click one to set its business and firm.</p><div class="list">${rows}</div>${moreBar('firmCandidates', candidates.length - shown.length, candidates.length)}`, { cls: 's12' }));
  }
  const note = coverage ? `<p class="note" style="margin-top:12px">${icon('info')}<span>${coverage}</span></p>` : '';
  return `<div class="grid">${cards.join('')}</div>${note}`;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Sync — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Onest:wght@500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f1f1ee; --surface: #ffffff; --surface-2: #f6f6f3; --surface-3: #e9e9e4;
  --card-border: #e5e5e0; --line: #e6e6e1; --line-2: #d3d3cc;
  --text: #15171a; --text-2: #4a5056; --muted: #7d8389;
  --accent: #0b6e4f; --accent-text: #0a6849; --accent-ink: #ffffff; --accent-soft: rgba(11,110,79,.10);
  --crit: #e23b4a;
  --radius: 20px; --radius-sm: 12px;
  --shadow: 0 24px 60px rgba(16,18,20,.16);
  --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Onest", "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="blue"]):not([data-theme="crimson"]) {
    color-scheme: dark;
    --bg: #08090a; --surface: #141618; --surface-2: #1b1e21; --surface-3: #25292d;
    --card-border: rgba(255,255,255,.05); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
    --text: #f4f4f1; --text-2: #b3b8bd; --muted: #7f858b;
    --accent: #2fbf8f; --accent-text: #45d6a3; --accent-ink: #03140d; --accent-soft: rgba(47,191,143,.14);
    --crit: #e5484d;
    --shadow: 0 24px 60px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; }
/* An author display rule beats the UA stylesheet, so label{display:block} and
   .consent{display:flex} both survived the hidden attribute. */
[hidden] { display: none !important; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; margin: 0; padding: 20px; -webkit-font-smoothing: antialiased;
}
h1 { font-family: var(--display); font-weight: 650; letter-spacing: -.02em; font-size: 21px; margin: 0 0 4px; }
p { margin: 0; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 20px; height: 20px; color: var(--accent-ink); }
.brand-word { font-family: var(--display); font-weight: 650; font-size: 16px; letter-spacing: -.015em; }

.card {
  background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 30px; width: 100%; max-width: 360px;
}
.sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; }
input {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--text); font: 14px var(--font); box-sizing: border-box;
  transition: border-color .12s, background .12s;
}
input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
button {
  width: 100%; margin-top: 22px; font-family: var(--font); font-weight: 650; font-size: 14px;
  padding: 11px; border-radius: 999px; border: 1px solid var(--accent); cursor: pointer;
  background: var(--accent); color: var(--accent-ink); transition: background .12s;
}
button:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
button:disabled { opacity: .6; cursor: default; }
.toggle { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
.toggle a { color: var(--accent-text); text-decoration: none; font-weight: 600; cursor: pointer; }
.error { color: var(--crit); font-size: 13px; margin-top: 12px; display: none; }
.consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
.consent input { width: 16px; height: 16px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.consent a { color: var(--accent-text); text-decoration: none; font-weight: 600; }
.consent a:hover { text-decoration: underline; }
.consent-list { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
.consent-list li { margin-bottom: 3px; }
.legal { text-align: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
.legal a { color: var(--muted); text-decoration: none; }
.legal a:hover { color: var(--text-2); text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Light blue, matching the Ledger and Bank Sync. */
:root[data-theme="blue"] {
  color-scheme: light;
  --bg: #eef5fc; --surface: #ffffff; --surface-2: #f5f9fe; --surface-3: #e5eff9;
  --card-border: #dae7f4; --line: #e2edf8; --line-2: #c4d8ed;
  --text: #0e1a29; --text-2: #3d5468; --muted: #6a8098;
  --accent: #1769c8; --accent-text: #135ab0; --accent-ink: #ffffff; --accent-soft: rgba(23,105,200,.10);
  --crit: #e23b4a;
  --shadow: 0 24px 60px rgba(17,52,94,.14);
}
/* Black and red, matching the Ledger. */
:root[data-theme="crimson"] {
  color-scheme: dark;
  --bg: #0a0708; --surface: #151011; --surface-2: #1d1618; --surface-3: #271e20;
  --card-border: rgba(255,255,255,.06); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16);
  --text: #f7f3f3; --text-2: #bdb2b4; --muted: #877d7f;
  --accent: #e5484d; --accent-text: #ff7075; --accent-ink: #12090a; --accent-soft: rgba(229,72,77,.15);
  --btn: #f7f3f3; --btn-ink: #0a0708;
  --pos: #3ccf7f; --neg: #ff8a8f; --warn: #f0a92b; --crit: #ff5257;
  --c0: #e5484d; --c1: #f08a3c; --c2: #3ccf7f; --c3: #d9a520;
  --c4: #e87ba4; --c5: #9085e9; --c6: #4ec3d9; --c7: #c2705f;
  --shadow: 0 24px 60px rgba(0,0,0,.72);
}
</style>
<script>
(function () {
  try {
    var t = localStorage.getItem('lvc-theme');
    if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* private mode: fall back to the system theme */ }
})();
</script>

</head>
<body>

<div>
  <div class="brand">
    <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21v-9M9.7 21v-9M14.3 21v-9M19 21v-9M2.5 9.5L12 3l9.5 6.5z"/></svg></span>
    <span class="brand-word">Bank Sync</span>
  </div>

  <div class="card">
    <h1 id="title">Sign in</h1>
    <div class="sub" id="subtitle">Your bank sync, just for you.</div>

    <form id="form">
      <div id="nameField" hidden>
        <label for="name">Name (optional)</label>
        <input id="name" name="name" type="text" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="consent" id="consentField" hidden>
        <input type="checkbox" id="consent" aria-describedby="consentText">
        <label for="consent" id="consentText">I understand this application retrieves my bank account and transaction
          data through Plaid and stores it, and I agree to the
          <a href="/privacy" target="_blank" rel="noopener">privacy policy</a>.</label>
      </div>
      <button id="submitBtn" type="submit">Sign in</button>
      <div class="error" id="error"></div>
    </form>

    <div class="toggle">
      <span id="toggleText">Don't have an account?</span>
      <a id="toggleLink">Sign up</a>
    </div>
  </div>

  <div class="legal"><a href="/privacy">Privacy policy</a> &middot; Read before you connect a bank.</div>
</div>

<script>
let mode = 'login';
const $ = (s) => document.querySelector(s);
const title = $('#title'), subtitle = $('#subtitle'), nameField = $('#nameField');
const consentField = $('#consentField'), consentBox = $('#consent');
const submitBtn = $('#submitBtn'), toggleText = $('#toggleText'), toggleLink = $('#toggleLink');
const errorEl = $('#error'), passwordInput = $('#password');

function applyMode() {
  if (mode === 'login') {
    title.textContent = 'Sign in';
    subtitle.textContent = 'Your bank sync, just for you.';
    nameField.hidden = true;
    submitBtn.textContent = 'Sign in';
    toggleText.textContent = "Don't have an account?";
    toggleLink.textContent = 'Sign up';
    passwordInput.autocomplete = 'current-password';
  } else {
    title.textContent = 'Create an account';
    subtitle.textContent = 'Each account keeps its own connected banks and ledger.';
    nameField.hidden = false;
    submitBtn.textContent = 'Create account';
    toggleText.textContent = 'Already have an account?';
    toggleLink.textContent = 'Sign in';
    passwordInput.autocomplete = 'new-password';
  }
  consentField.hidden = mode !== 'signup';
  if (mode !== 'signup') consentBox.checked = false;
  errorEl.style.display = 'none';
}
toggleLink.addEventListener('click', () => { mode = mode === 'login' ? 'signup' : 'login'; applyMode(); });

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.style.display = 'none';
  submitBtn.disabled = true;
  try {
    if (mode === 'consent') {
      if (!consentBox.checked) throw new Error('Please confirm to continue.');
      const r = await fetch('/api/auth/consent', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ consent: true }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Could not record that.');
      window.location.href = '/';
      return;
    }
    const body = { email: $('#email').value.trim(), password: passwordInput.value };
    if (mode === 'signup') {
      if (!consentBox.checked) throw new Error('Please confirm you understand what this application collects.');
      body.name = $('#name').value.trim();
      body.consent = true;
    }
    const res = await fetch(mode === 'login' ? '/api/auth/login' : '/api/auth/signup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    // An account created before consent was recorded, or one a version behind,
    // agrees here rather than being assumed to have agreed already.
    if (data.user && !data.user.consentCurrent) { askExistingConsent(); return; }
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
});

/* An account created before consent was recorded, or one a version behind,
   agrees here. Sign-in has already succeeded and set the session cookie, so
   this posts as that person — the session is the proof of who agreed. */
function askExistingConsent() {
  mode = 'consent';
  title.textContent = 'One thing before you continue';
  subtitle.textContent = 'Your account predates this step. Nothing has changed about what is collected.';
  nameField.hidden = true;
  for (const id of ['email', 'password']) {
    const f = $('#' + id);
    f.hidden = true;
    f.required = false;
    if (f.previousElementSibling) f.previousElementSibling.hidden = true;
  }
  consentField.hidden = false;
  consentBox.checked = false;
  submitBtn.textContent = 'Agree and continue';
  $('.toggle').hidden = true;
  errorEl.style.display = 'none';
}

applyMode();
</script>
</body>
</html>
